<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2e2b">
<meta name="description" content="Mammamia · Gestão de compras, faturas, vendas, custos fixos, fichas técnicas e food cost">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mammamia">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Mammamia · Gestão de Compras</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f5f7;--card:#fff;--ink:#131820;--mut:#6b7280;--line:#e5e7eb;--acc:#0f766e;--accbg:#ecfdf5;--red:#b91c1c;--redbg:#fef2f2;--amb:#b45309;--ambbg:#fffbeb;--blu:#1d4ed8;--blubg:#eff6ff}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;padding-bottom:26px}
header{position:sticky;top:0;z-index:30;background:#0f2e2b;color:#fff;padding:11px 13px 10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header h1{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1 span.em{font-size:18px}
#ver{font-size:9.5px;font-weight:700;background:rgba(255,255,255,.16);padding:2px 6px;border-radius:6px}
header .sub{font-size:11px;opacity:.72;margin-top:2px}
nav.tabs{display:flex;flex-wrap:wrap;gap:3px;margin-top:9px;background:rgba(255,255,255,.09);border-radius:12px;padding:4px}
nav.tabs button{flex:1 1 60px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:600;color:rgba(255,255,255,.72);padding:6px 3px;border-radius:9px;line-height:1.1}
nav.tabs button .e{font-size:15px;line-height:1}
nav.tabs button.on{background:#fff;color:#0f2e2b;font-weight:800}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card.tight{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mut{color:var(--mut)}.small{font-size:12px}.tiny{font-size:11px}.b{font-weight:700}
input,select,button,textarea{font-family:inherit;font-size:16px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[readonly],select[disabled]{background:#f1f5f9!important;color:#64748b}
input:focus,select:focus,textarea:focus{outline:2px solid #99f6e4;border-color:var(--acc)}
button{cursor:pointer;border:0;background:none;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--acc);color:#fff;border-radius:11px;padding:12px 14px;font-weight:600;width:100%;font-size:15px}
.btn.ghost{background:#fff;color:var(--acc);border:1px solid #cbd5d3}
.btn.grey{background:#eef0f3;color:#374151}
.btn.danger{background:var(--redbg);color:var(--red);border:1px solid #fecaca}
.btn.sm{width:auto;padding:8px 12px;font-size:13.5px;border-radius:9px}
.btn.xs{width:auto;padding:6px 10px;font-size:12px;border-radius:8px;white-space:nowrap}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:#374151;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid #f1f2f4;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0}
.item .nm .n{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm .m{font-size:11.5px;color:var(--mut);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .pr{text-align:right;flex:0 0 auto}
.item .pr .p{font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px}
.item .pr .u{font-size:11px;color:var(--mut)}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:600}
.bdg-g{background:var(--accbg);color:var(--acc)}.bdg-a{background:var(--ambbg);color:var(--amb)}
.bdg-r{background:var(--redbg);color:var(--red)}.bdg-b{background:var(--blubg);color:var(--blu)}
.bdg-m{background:#ede9fe;color:#6d28d9}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding-bottom:100px}
.sheet .top{position:sticky;top:0;background:#0f2e2b;color:#fff;padding:11px 14px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .top .t{flex:1;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{background:rgba(255,255,255,.15);border-radius:9px;padding:7px 11px;color:#fff;font-weight:700;font-size:14px}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp td{padding:7px 4px;border-bottom:1px solid #f1f2f4}
table.cmp tr:last-child td{border-bottom:0}
table.cmp td.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
tr.best td{background:var(--accbg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:10.5px;color:var(--mut);margin-top:2px}
.empty{padding:22px 14px;text-align:center;color:var(--mut);font-size:13px}
.note{background:var(--ambbg);border:1px solid #fde68a;color:#92400e;border-radius:11px;padding:9px 11px;font-size:12px;margin-bottom:10px}
.note.b{background:var(--blubg);border-color:#bfdbfe;color:#1e40af}
.note.g{background:var(--accbg);border-color:#a7f3d0;color:#065f46}
.note.r{background:var(--redbg);border-color:#fecaca;color:#b91c1c}
.note.p{background:#f5f3ff;border-color:#ddd6fe;color:#5b21b6}
.line{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #f1f2f4}
.line input[type=number],.line input[type=text]{width:76px;text-align:right;padding:7px 8px}
.line .nm{flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .ct{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--mut);min-width:56px;text-align:right}
.rm{color:#9ca3af;font-size:17px;padding:2px 4px}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
.tot.big{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.tot label{color:#4b5563}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:block;font-size:11.5px;color:var(--mut);margin:0 0 4px 2px;font-weight:600}
.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mt8{margin-top:8px}.mt10{margin-top:10px}
.pick{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;background:#fff}
.pick button{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid #f1f2f4;font-size:13.5px}
.pick button:last-child{border-bottom:0}
.pill{font-size:11px;background:#f1f2f4;color:#374151;border-radius:6px;padding:2px 7px;font-weight:600}
.loja{border:1px solid #d1fae5;background:#f0fdfa;border-radius:11px;padding:9px 11px;margin-bottom:8px}
.loja .lh{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.loja .li{font-size:11.5px;color:#065f46;margin-top:3px;line-height:1.5}
.fat{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #f1f2f4;width:100%;text-align:left}
.fat:last-child{border-bottom:0}
.fat .th{width:40px;height:40px;border-radius:9px;background:#f1f2f4;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;overflow:hidden}
.fat .in{flex:1;min-width:0}.fat .in .d{font-weight:700;font-size:13.5px}.fat .in .s{font-size:11px;color:var(--mut);margin-top:1px}
.fat .vl{text-align:right;flex:0 0 auto}.fat .vl .t{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}.fat .vl .i{font-size:10.5px;color:var(--mut)}
.delbtn{background:var(--redbg);color:var(--red);border:1px solid #fecaca;border-radius:9px;padding:6px 9px;font-size:13px;font-weight:700;flex:0 0 auto}
.delbar{background:var(--redbg);border:1px solid #fecaca;color:#b91c1c;border-radius:11px;padding:9px 11px;font-size:12.5px;margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crebtn{background:var(--acc);color:#fff;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:700}
.aliaspill{background:#ecfdf5;color:#0f766e;border:1px solid #a7f3d0;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:700}
.convbox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;padding:9px;margin-top:7px}
.convbox .cw{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.convbox .cw3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.convbox input[type=number],.convbox input[type=text],.convbox select{padding:7px 8px;font-size:15px}
.res{background:var(--accbg);border:1px solid #a7f3d0;color:#065f46;border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:700;margin-top:7px;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #a7f3d0;border-top-color:#0f766e;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:9px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:4px 0 8px}
.bfill{height:100%;background:linear-gradient(90deg,#0f766e,#14b8a6);border-radius:6px}
.grp{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:10px;background:#fbfcfd}
.grp .gh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.grp .gh input.gname{flex:1;min-width:0;font-weight:700;font-size:14.5px;padding:4px 7px;background:transparent;border:1px solid transparent;border-radius:7px}
.grp .gh input.gname:focus{background:#fff;border-color:var(--line)}
.vrow{display:flex;gap:8px;align-items:center;padding:5px 0}
.vrow input[type=text]{flex:1;min-width:0;font-size:14.5px;padding:7px 9px}
.vrow input[type=number],.vrow input.dec{width:92px;text-align:right;font-size:15px;padding:7px 9px}
.vrow .pct{font-size:11px;color:var(--mut);width:42px;text-align:right;flex:0 0 auto}
.vitem{border-top:1px solid #f1f2f4;padding:7px 0 4px}
.vitem:first-of-type{border-top:0}
.v3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:5px}
.v3>div{min-width:0}
.v3 label{display:block;font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin:0 0 2px 2px;font-weight:700}
.v3 input[type=number],.v3 input.dec{text-align:right;font-size:15px;padding:8px 7px;font-variant-numeric:tabular-nums}
.v3 input.ro{background:#ecfdf5;color:#0f766e;font-weight:800;border-color:#a7f3d0}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#f1f5f9}
.zoom{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;padding:10px}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.zoom .zx{position:absolute;top:12px;right:16px;color:#fff;font-size:26px;font-weight:800;line-height:1}
.recline{background:#f5f3ff;border-radius:10px;padding:7px 8px;margin:6px 0}
.recline .nm{font-weight:700;font-size:13.5px;color:#5b21b6}
.fline{border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-bottom:8px;background:#fbfcfd}
.fline .ftop{display:flex;align-items:center;gap:8px}
.fline .ftop .nm{flex:1;min-width:0;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fline .finfo{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.35}
.fline .frow{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.fline .frow input[type=text]{width:78px;text-align:right;padding:7px 8px;font-size:15px}
.fline .frow input.rend{width:70px}
.fline .fcost{margin-left:auto;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.fline .rendlab{font-size:10.5px;color:var(--mut);font-weight:600}
.linkbtn{font-size:11px;color:#0f766e;text-decoration:underline;font-weight:600}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}
@media (min-width:760px){
  body{font-size:16px}
  header{padding-top:14px;padding-bottom:12px;padding-left:max(24px,calc((100vw - 1060px)/2));padding-right:max(24px,calc((100vw - 1060px)/2))}
  header h1{font-size:18px;gap:10px}
  header h1 span.em{font-size:23px}
  header .sub{font-size:12.5px;margin-top:4px}
  nav.tabs{gap:6px;padding:5px;margin-top:11px;flex-wrap:nowrap}
  nav.tabs button{flex:0 0 auto;flex-direction:row;gap:8px;font-size:13px;padding:9px 13px;border-radius:10px}
  nav.tabs button .e{font-size:17px}
  .wrap{max-width:1100px;padding:18px 20px 46px}
  .card{padding:16px;border-radius:16px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi{padding:13px 15px}
  .kpi .v{font-size:20px}
  .item{padding:13px 16px}
  .item .nm .n{font-size:15.5px}
  .item .nm .m{font-size:12.5px}
  .item .pr .p{font-size:16px}
  .item:hover,.fat:hover,.pick button:hover{background:#f8fafc}
  .chip:hover{border-color:#0f766e;color:#0f766e}
  .pick{max-height:320px}
  .chips{gap:9px}
  .chip{padding:8px 14px;font-size:14px}
  .btn{font-size:16px;padding:13px 16px}
  .line .nm{font-size:14.5px}
  .gal{grid-template-columns:repeat(3,1fr)}
  .sheet{display:flex;justify-content:center;align-items:flex-start;background:rgba(15,23,32,.5);padding-bottom:0}
  .sheet .wrap{width:100%;max-width:820px;min-height:100vh;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.35);padding-bottom:70px}
  .sheet .top{padding:13px 20px}
  .sheet .top .t{font-size:16px}
  .vrow input[type=number],.vrow input.dec{width:120px}
  .v3{gap:9px;max-width:520px}
  .v3 input[type=number],.v3 input.dec{font-size:16px;padding:9px 10px}
  .fline .ftop .nm{font-size:15px}
  .fline .frow input[type=text]{width:92px}
  .fline .frow input.rend{width:80px}
}
@media (display-mode:standalone){header{padding-top:calc(11px + env(safe-area-inset-top))}body{padding-bottom:calc(26px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>

<header>
  <h1><span class="em">🍝</span> Mammamia <span id="ver">v46</span></h1>
  <div class="sub">Compras · faturas · vendas · custos fixos · food cost &nbsp;|&nbsp; <span id="hdrCount"></span></div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="view" class="wrap"></main>

<!-- ============ MÓDULO CONFIGURAÇÃO (isolado) ============ -->
<script>
"use strict";
var CFGP={ivaCompra:23,ivaCusto:23};

function ivaOpts(cur){
  var o="";
  var vs=[23,13,6,0];
  for(var i=0;i<vs.length;i++){
    var v=vs[i];
    var txt=(v>0)?(v+"%"):"Isento (0%)";
    o+='<option value="'+v+'"'+sel(Number(cur)===v)+">"+txt+"</option>";
  }
  return o;
}

function cfgBox(title,inner){
  return '<div class="card"><div class="b mb8">'+title+'</div>'+inner+'</div>';
}

function viewConfig(){
  var h='<div class="note p">⚙️ <b>Configuração.</b> As definições do app: chave da IA, base de dados na nuvem, impostos, cópias de segurança e limpeza de dados. Os <b>fornecedores</b> gerem-se na aba 📷 Compras.</div>';

  var s1="";
  s1+='<div class="small mut mb8">Grátis em aistudio.google.com → Get API key → copia a chave (AIza...). Cola só os caracteres, sem espaços.</div>';
  s1+='<input type="text" id="gk" placeholder="AIza..." class="mb8">';
  s1+='<label class="f">Modelo preferido</label><select id="mdl" class="mb8">'+modeloOpts()+'</select>';
  s1+='<button class="btn" data-act="savegkey">Guardar chave</button>';
  var s2="";
  s2+='<div class="row between mb8"><div class="b">🔑 Chave ligada ✔</div>';
  s2+='<button class="btn ghost sm" data-act="delgkey">Trocar</button></div>';
  s2+='<label class="f">Modelo preferido</label><select id="mdl" class="mb8">'+modeloOpts()+'</select>';
  s2+='<button class="btn ghost sm mt8" data-act="testar" style="width:100%">🧪 Testar modelos disponíveis</button>';
  h+=cfgBox("🔑 Chave do Google (leitura de faturas por IA)", CFG.gkey?s2:s1);

  var s3="";
  if(sync.on){
    s3+='<div class="note g">Ligado ✔ <span class="small">'+esc(sync.msg||"")+'</span></div>';
    s3+='<button class="btn ghost sm mb8" data-act="dbsync" style="width:100%">🔄 Sincronizar agora</button>';
    s3+='<button class="btn danger sm" data-act="dboff" style="width:100%">Desligar</button>';
  }else{
    s3+='<div class="small mut mb8">Cola o URL e a chave pública (anon) do teu projecto Supabase. Depois executa o SQL abaixo uma vez no SQL Editor do Supabase.</div>';
    s3+='<label class="f">URL do projecto</label>';
    s3+='<input type="text" id="dbU" value="'+esc(CFG.url)+'" class="mb8" placeholder="https://xxxxx.supabase.co">';
    s3+='<label class="f">Chave pública (anon)</label>';
    s3+='<input type="text" id="dbK" value="'+esc(CFG.key)+'" class="mb8" placeholder="eyJhbGciOi...">';
    s3+='<button class="btn" data-act="dbon">Guardar e ligar</button>';
    s3+='<details style="margin-top:10px"><summary class="small mut" style="cursor:pointer">📄 SQL para criar as tabelas (clica para abrir)</summary>';
    s3+='<textarea id="dbSQL" rows="6" style="font-size:10px;line-height:1.2;margin-top:8px">'+esc(SQL_DB)+'</textarea>';
    s3+='<button class="btn ghost sm mt8" data-act="copysql" style="width:100%">📋 Copiar SQL</button></details>';
  }
  h+=cfgBox("☁️ Base de dados (Supabase)",s3);

  var pendF=FATURAS.filter(function(f){return !f.sync;}).length;
  var s3b="";
  s3b+=sync.on?('<div class="note g">Ligado ✔ <span class="small">'+esc(sync.msg||"")+'</span></div>'):'<div class="note">A base de dados está desligada.</div>';
  if(sync.err)s3b+='<div class="note r">'+esc(sync.err)+'</div>';
  s3b+='<div class="small mut mb8">Dados em texto: <b>'+kb(snapshot().length)+'</b>';
  if(st.stor)s3b+=' · Telefone: <b>'+mb(st.stor.uso)+'</b> de '+mb(st.stor.quota);
  s3b+='</div>';
  if(st.stor){
    s3b+='<div class="bar"><div class="bfill" style="width:'+Math.min(100,Math.round(st.stor.uso/Math.max(1,st.stor.quota)*100))+'%"></div></div>';
  }
  s3b+='<button class="btn ghost sm mb8" data-act="enviarfotos" style="width:100%">📤 Enviar fotos pendentes para a nuvem</button>';
  s3b+='<button class="btn ghost sm mb8" data-act="reenviarfat" style="width:100%">🔄 Reenviar faturas em falta ('+pendF+')</button>';

function custoFicha(f,nivel){
  nivel=nivel||0;

  var t=0;
  for(var i=0;i<f.lin.length;i++){
    t=t+custoLinha(f.lin[i]);
  }
  var rs=f.recs||[];
  for(var j=0;j<rs.length;j++){
    var r=rs[j];

    var pi=prodInfo(sub);

function somaPeso(f){
  var t=0,kg=0,lt=0,un=0,dz=0;
  if(!f)return {total:0,kg:0,L:0,un:0,dz:0};
  for(var i=0;i<f.lin.length;i++){
    var l=f.lin[i];
    var q=Number(l[1])||0;
    var a=BYNAME[l[0]];
    if(!a)continue;
    var u=uP(a.u);
    t=t+q;
    if(u==="kg")kg=kg+q;
    else if(u==="L")lt=lt+q;
    else if(u==="dz")dz=dz+q;
    else un=un+q;
  }
  var rs=f.recs||[];
  for(var j=0;j<rs.length;j++){
    var sub=fichaById(rs[j][0]);
    if(!sub)continue;
    var sp=prodInfo(sub);
    var q2=Number(rs[j][1])||0;
    t=t+q2;
    if(sp.u==="kg")kg=kg+q2;
    else if(sp.u==="L")lt=lt+q2;
    else if(sp.u==="dz")dz=dz+q2;
    else un=un+q2;
  }
  return {total:t,kg:kg,L:lt,un:un,dz:dz};
}

var ALIAS={};
function aliasCands(desc){
  var t=toks(desc).filter(function(w){return !/^\d+([.,]\d+)?$/.test(w);});
  var out=[];
  for(var n=1;n<=Math.min(4,t.length);n++){var k=t.slice(0,n).join(" ");if(out.indexOf(k)<0)out.push(k);}
  var full=normTxt(desc);
  if(full&&out.indexOf(full)<0)out.push(full);
  return out;
}
function aliasCandsLongas(desc){
  var t=toks(desc).filter(function(w){return !/^\d+([.,]\d+)?$/.test(w);});
  var out=[];
  for(var n=2;n<=Math.min(4,t.length);n++){var k=t.slice(0,n).join(" ");if(out.indexOf(k)<0)out.push(k);}
  var full=normTxt(desc);
  if(t.length>=2&&full&&out.indexOf(full)<0)out.push(full);
  return out;
}
function aliasFind(desc){
  var cs=aliasCands(desc);
  for(var i=cs.length-1;i>=0;i--){
    var a=ALIAS[cs[i]];
    if(a&&a.artigo&&BYNAME[a.artigo])return {k:cs[i],rec:a};
  }
  return null;
}
function aliasLoad(){try{var e=JSON.parse(store.get("mammamia_alias")||"{}");Object.keys(e).forEach(function(k){ALIAS[k]=e[k];});}catch(x){}}
function aliasSave(){try{store.set("mammamia_alias",JSON.stringify(ALIAS));}catch(x){}}
function aliasRemember(desc,artigo){
  if(!desc||!artigo)return null;
  var cs=aliasCandsLongas(desc);
  if(!cs.length)cs=[normTxt(desc)];
  cs.forEach(function(k){if(k)ALIAS[k]={artigo:artigo,desc:String(desc),quando:hoje()};});
  aliasSave();
  cs.forEach(function(k){if(k)dbUpAlias(k,ALIAS[k]);});
  return cs[0];
}
function aliasForget(k){if(!k)return;delete ALIAS[k];aliasSave();dbDelAlias(k);}

function fornLoad(){try{var e=JSON.parse(store.get("mammamia_forn")||"{}");Object.keys(e).forEach(function(k){SUP[k]=e[k];});}catch(x){}}
function fornSave(){var o={};Object.keys(SUP).forEach(function(k){if(SUP_BASE.indexOf(k)<0)o[k]=SUP[k];});try{store.set("mammamia_forn",JSON.stringify(o));}catch(x){}}
function fornAdd(nome){
  var n=String(nome||"").trim();if(!n)return null;
  var achou=null;
  Object.keys(SUP).forEach(function(k){if(semAcento(SUP[k])===semAcento(n))achou=k;});
  if(achou)return achou;
  var k="u"+Date.now().toString(36);SUP[k]=n;fornSave();return k;
}
function fornDel(k){if(SUP_BASE.indexOf(k)>=0)return false;delete SUP[k];fornSave();return true;}
function fornUsado(k){
  var u=false;
  Object.keys(HIST).forEach(function(id){(HIST[id]||[]).forEach(function(h){if(h.s===k)u=true;});});
  COMPRAS.forEach(function(c){if(c.s===k)u=true;});
  FATURAS.forEach(function(f){if(f.forn===k)u=true;});
  return u;
}
function matchSup(s){
  var t=normTxt(s);
  if(!t)return "";
  var k;
  for(k in SUP){if(normTxt(SUP[k])===t)return k;}
  for(k in SUP){var n=normTxt(SUP[k]);if(t.indexOf(n)>=0||n.indexOf(t)>=0)return k;}
  var p=t.split(" ")[0];
  for(k in SUP){if(normTxt(SUP[k]).split(" ")[0]===p)return k;}
  return "";
}
function supKey(s){
  var t=String(s||"").trim();
  if(!t)return "";
  if(SUP[t])return t;
  return matchSup(t);
}

var FOTOS_MEM={},FOTOS_URL={},idbDb=null;
function idbOpen(){return new Promise(function(res,rej){try{
  if(!window.indexedDB)throw new Error("sem indexedDB");
  var r=indexedDB.open("mammamia_fotos",1);
  r.onupgradeneeded=function(){var db=r.result;if(!db.objectStoreNames.contains("fotos"))db.createObjectStore("fotos");};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};
}catch(e){rej(e);}});}
function idbOp(mode,fn){return (async function(){
  try{
    if(!idbDb)idbDb=await idbOpen();
    await new Promise(function(ok,no){
      var tx=idbDb.transaction("fotos",mode);
      fn(tx.objectStore("fotos"));
      tx.oncomplete=function(){ok();};tx.onerror=function(){no(tx.error);};
    });
    return true;
  }catch(e){return false;}
})();}
function fotoLocalPut(k,d){return idbOp("readwrite",function(os){os.put(d,k);}).then(function(ok){if(!ok)FOTOS_MEM[k]=d;return ok;});}
function fotoLocalGet(k){return idbOp("readonly",function(os){var r=os.get(k);r.onsuccess=function(){FOTOS_MEM[k]=FOTOS_MEM[k]||r.result||null;};}).then(function(){return FOTOS_MEM[k]||null;});}
function fotoLocalDel(k){delete FOTOS_MEM[k];return idbOp("readwrite",function(os){os.delete(k);});}
function fotoKey(id,n){return (n&&n>0)?(id+"_"+n):id;}
function fotoUrlPublica(id,n){
  var nome=(n&&n>0)?(id+"_"+n+".jpg"):(id+".jpg");
  return CFG.url.replace(/\/+$/,"")+"/storage/v1/object/public/faturas/"+nome;
}
function fotoUploadNuvem(id,dataUrl,n){
  return new Promise(function(res){
    if(!dbOn()||!dataUrl){res("");return;}
    var blob=dataUrlToBlob(dataUrl);
    if(!blob){res("");return;}
    var h={apikey:CFG.key,"Content-Type":"image/jpeg","x-upsert":"true"};
    if(CFG.key.indexOf("eyJ")===0)h.Authorization="Bearer "+CFG.key;
    var nome=(n&&n>0)?(id+"_"+n+".jpg"):(id+".jpg");
    fetch(CFG.url.replace(/\/+$/,"")+"/storage/v1/object/faturas/"+nome,{method:"POST",headers:h,body:blob})
      .then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error(t);res(fotoUrlPublica(id,n));});})
      .catch(function(){res("");});
  });
}
function guardarUrlFoto(key,url){if(!url)return;FOTOS_URL[key]=url;try{store.set("mammamia_fotourl",JSON.stringify(FOTOS_URL));}catch(e){}}
function guardarFotoFatura(id,dataUrl,n){
  var key=fotoKey(id,n);
  return fotoUploadNuvem(id,dataUrl,n).then(function(url){
    if(url){guardarUrlFoto(key,url);return fotoLocalDel(key).then(function(){return url;});}
    return fotoLocalPut(key,dataUrl).then(function(){return "";});
  });
}
async function fotosDaFatura(f){
  var out=[];
  if(!f)return out;
  for(var i=0;i<MAXFOTOS;i++){
    var key=fotoKey(f.id,i);
    var loc=await fotoLocalGet(key);
    if(loc){out.push(loc);continue;}
    var url=null;
    if(f.fotos&&f.fotos[i])url=f.fotos[i];
    else if(i===0&&f.fotoUrl)url=f.fotoUrl;
    else if(FOTOS_URL[key])url=FOTOS_URL[key];
    if(url)out.push(url);
  }
  return out;
}
async function apagarFotosFatura(id){
  for(var i=0;i<MAXFOTOS;i++){
    var key=fotoKey(id,i);
    await fotoLocalDel(key);
    delete FOTOS_URL[key];
  }
  try{store.set("mammamia_fotourl",JSON.stringify(FOTOS_URL));}catch(e){}
}
function dataUrlToBlob(dataUrl){
  try{
    var p=dataUrl.split(",");
    var mime=(p[0].match(/:(.*?);/)||[])[1]||"image/jpeg";
    var bin=atob(p[1]),len=bin.length,arr=new Uint8Array(len);
    for(var i=0;i<len;i++)arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});
  }catch(e){return null;}
}
function comprimirFoto(dataUrl,cb){
  var im=new Image();
  im.onload=function(){
    var max=1100,w=im.width,h=im.height;
    if(w>max){h=Math.round(h*max/w);w=max;}
    var c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(im,0,0,w,h);
    try{cb(c.toDataURL("image/jpeg",0.62));}catch(e){cb(null);}
  };
  im.onerror=function(){cb(null);};
  im.src=dataUrl;
}
function comprimirP(dataUrl){return new Promise(function(ok){comprimirFoto(dataUrl,ok);});}

function db(path,opt){
  opt=opt||{};
  var h={apikey:CFG.key,"Content-Type":"application/json"};
  if(CFG.key.indexOf("eyJ")===0)h.Authorization="Bearer "+CFG.key;
  if(opt.headers)Object.keys(opt.headers).forEach(function(k){h[k]=opt.headers[k];});
  return fetch(CFG.url.replace(/\/+$/,"")+"/rest/v1/"+path,{method:opt.method||"GET",headers:h,body:opt.body})
    .then(function(r){return r.text().then(function(txt){if(!r.ok)throw new Error(txt||("HTTP "+r.status));return txt?JSON.parse(txt):null;});});
}

async function dbPull(quiet){
  if(!dbOn())return;
  sync.busy=1;
  if(!quiet){sync.msg="A carregar da base de dados…";sync.err="";render();}
  try{
    var pr=await db("precos?select=*&order=data.asc")||[];
    var fi=await db("fichas?select=*")||[];
    var co=await db("compras?select=*&order=data.asc")||[];
    var fa=[];try{fa=await db("faturas?select=*&order=data.asc")||[];}catch(e){fa=[];}
    var ar=[];try{ar=await db("artigos?select=*")||[];}catch(e){ar=[];}
    var al=[];try{al=await db("aliases?select=*")||[];}catch(e){al=[];}
    var ve=[];try{ve=await db("vendas?select=*")||[];}catch(e){ve=[];}
    var cu=[];try{cu=await db("custos?select=*")||[];}catch(e){cu=[];}
    ar.forEach(function(r){
      if(MERGED[r.nome])return;
      addCat({uid:r.uid,nome:r.nome,categoria:r.categoria,unidade:r.unidade,pack:r.pack,preco:r.preco,fornecedor:supKey(r.fornecedor||"")||"rc"});
    });
    al.forEach(function(r){if(r&&r.chave&&r.artigo)ALIAS[r.chave]={artigo:r.artigo,desc:r.descricao||r.chave,quando:hoje()};});
    Object.keys(HIST).forEach(function(k){delete HIST[k];});
    pr.forEach(function(r){
      var fonte=r.fonte||"";
      if(fonte.indexOf("MERGED:")===0){
        var rest=fonte.slice(7),sep=rest.indexOf("->");
        if(sep>0)MERGED[rest.slice(0,sep)]=rest.slice(sep+2);
        return;
      }
      if(fonte.indexOf("CATALOGO:")===0){
        var m=null;try{m=JSON.parse(fonte.slice(9));}catch(e){}
        addCat({uid:m&&m.uid?m.uid:undefined,nome:r.artigo,categoria:m?m.c:"merc",unidade:m?m.u:"un",pack:m?m.pk:1,preco:Number(r.preco)||0,fornecedor:supKey(r.fornecedor||"")||"rc"});
        return;
      }
      if(fonte.indexOf("ALIAS:")===0){
        var rest2=fonte.slice(6),sep2=rest2.indexOf("::");
        var chave=sep2>=0?rest2.slice(0,sep2):rest2;
        var descr=sep2>=0?rest2.slice(sep2+2):"";
        if(chave&&r.artigo)ALIAS[chave]={artigo:r.artigo,desc:descr,quando:String(r.data||"").slice(0,10)};
        return;
      }
      var pv=Number(r.preco);
      if(!(pv>0))return;
      var i=BYNAME[r.artigo];
      if(!i)return;
      (HIST[i.id]=HIST[i.id]||[]).push({d:String(r.data).slice(0,10),p:pv,s:r.fornecedor||"",f:r.fonte||""});
    });
    Object.keys(HIST).forEach(function(k){HIST[k].sort(function(a,b){return a.d.localeCompare(b.d);});});
    if(fi.length){
      var nova=[];
      fi.forEach(function(f,k){
        var rc=[];
        if(f.recs){
          try{
            var arr=JSON.parse(f.recs);
            if(arr&&arr.length)rc=arr.map(function(r){return [Number(r[0]),Number(r[1])];});
          }catch(e){rc=[];}
        }
        nova.push({uid:f.uid,id:k+1,nome:f.nome,cat:f.categoria||"prato",pvp:Number(f.pvp)||0,
          rend:Number(f.rend)||1,prod:String(f.prod||""),prodAuto:(f.prod_auto!==false),
          lin:(f.linhas||[]).map(function(l){return normLin(l);}),recs:rc});
      });
      FICHAS=nova;
      nextFid=FICHAS.length+1;
    }
    COMPRAS.length=0;
    co.forEach(function(r){COMPRAS.push({n:r.artigo,d:String(r.data).slice(0,10),q:Number(r.qtd),u:r.unidade||"",t:Number(r.total),p:Number(r.preco_unit),s:supKey(r.fornecedor||"")||r.fornecedor||""});});

function unificarArtigos(masterId,ids){
  var master=ING[masterId];
  if(!master)return {n:0,precos:0};
  var n=0,np=0;
  ids.forEach(function(id){
    var a=ING[id];
    if(!a||a===master)return;
    var hm=HIST[a.id]||[];
    if(hm.length){
      if(!HIST[master.id])HIST[master.id]=[];
      HIST[master.id]=HIST[master.id].concat(hm);
      HIST[master.id].sort(function(x,y){return x.d.localeCompare(y.d);});
      np+=hm.length;
    }
    delete HIST[a.id];
    COMPRAS.forEach(function(c){if(c.n===a.n)c.n=master.n;});
    FICHAS.forEach(function(f){f.lin.forEach(function(l){if(l[0]===a.n)l[0]=master.n;});});
    var cs=aliasCandsLongas(a.n);
    cs.forEach(function(k){if(k)ALIAS[k]={artigo:master.n,desc:a.n,quando:hoje()};});
    if(!cs.length)ALIAS[normTxt(a.n)]={artigo:master.n,desc:a.n,quando:hoje()};
    MERGED[a.n]=master.n;
    delete BYNAME[a.n];
    var cx=CUSTOM.indexOf(a);if(cx>=0)CUSTOM.splice(cx,1);
    var ix=ING.indexOf(a);if(ix>=0)ING.splice(ix,1);
    cs.forEach(function(k){if(k)dbUpAlias(k,ALIAS[k]);});
    dbDelPrecosArtigo(a.n);
    dbMarcarUniao(a.n,master.n);
    n++;
  });
  if(master.custom)dbUpArtigo(master);
  (HIST[master.id]||[]).forEach(function(h){
    if(h.f==="Exemplo (demonstração)")return;
    dbUpPreco(master.n,h.d,h.p,h.s,h.f||"Unificação");
  });
  save();
  return {n:n,precos:np};
}

function b64ToBytes(b64){
  var bin=atob(b64||"");
  var arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return arr;
}
async function geminiUploadFile(file,key){
  var fd=new FormData();
  fd.append("file",file,file.name||"fatura.pdf");
  fd.append("metadata",JSON.stringify({file:{display_name:file.name||"fatura.pdf"}}));
  var r=await fetch(GEM+"/upload/v1beta/files?key="+encodeURIComponent(key),{method:"POST",body:fd});
  var txt=await r.text();
  if(!r.ok)throw new Error((txt||("HTTP "+r.status)).slice(0,200));
  var j=JSON.parse(txt);
  if(!j.file)throw new Error("resposta sem ficheiro");
  return j.file;
}
async function geminiWaitFile(file,key){
  var nm=String(file.name||"").replace(/^files\//,"");
  var url=GEM+"/v1beta/files/"+nm+"?key="+encodeURIComponent(key);
  for(var i=0;i<120;i++){
    var r=await fetch(url);
    if(!r.ok)throw new Error("estado HTTP "+r.status);
    var j=await r.json();
    if(j.state==="ACTIVE")return j;
    if(j.state==="FAILED")throw new Error((j.error&&j.error.message)||"processamento falhou");
    await new Promise(function(res){setTimeout(res,1500);});
  }
  throw new Error("tempo esgotado a processar o ficheiro");
}
async function parteParaPagina(p,key){
  if(!p.pdf)return {inline_data:{mime_type:p.mime||"image/jpeg",data:p.b64||""}};
  var bytes=null;
  if(p.file&&p.file.arrayBuffer)bytes=new Uint8Array(await p.file.arrayBuffer());
  else if(p.b64)bytes=b64ToBytes(p.b64);
  if(!bytes||!bytes.length)throw new Error("PDF vazio");
  var file=null,erro=null;
  try{
    file=await geminiUploadFile(new Blob([bytes],{type:"application/pdf"}),key);
    if(!file.uri)file.uri=GEM+"/v1beta/files/"+String(file.name||"").replace(/^files\//,"");
  }catch(e){erro=e;}
  if(file){
    try{
      var act=await geminiWaitFile(file,key);
      return {file_data:{mime_type:"application/pdf",file_uri:act.uri||file.uri||file.name}};
    }catch(e){erro=e;}
  }
  if(bytes.length<13000000){
    var chunk=0x8000,arr=[];
    for(var j=0;j<bytes.length;j+=chunk)arr.push(String.fromCharCode.apply(null,bytes.subarray(j,j+chunk)));
    return {inline_data:{mime_type:"application/pdf",data:btoa(arr.join(""))}};
  }
  throw new Error((erro&&erro.message)||"não consegui enviar o PDF");
}

function dataLimite(dias){var d=new Date();d.setDate(d.getDate()-(dias||30));return dataLocal(d);}
function precoRecente(i,dias){
  if(!i)return {opts:[],best:null,rec:false};
  var lim=dataLimite(dias||30);
  var h=(HIST[i.id]||[]).filter(function(x){return x.d>=lim&&x.p>0;});
  var porSup={};
  h.forEach(function(x){var s=x.s||"?";if(!porSup[s]||x.d>porSup[s].d)porSup[s]={p:x.p,d:x.d};});
  var opts=Object.keys(porSup).map(function(s){return {s:s,p:porSup[s].p,d:porSup[s].d};});
  if(opts.length){opts.sort(function(a,b){return a.p-b.p;});return {opts:opts,best:opts[0],rec:true};}
  var fb=[];
  if(i.sup&&i.base>0)fb.push({s:i.sup,p:i.base,d:""});
  Object.keys(i.x||{}).forEach(function(k){if(i.x[k]>0)fb.push({s:k,p:i.x[k]/i.pk,d:""});});
  fb.sort(function(a,b){return a.p-b.p;});
  return {opts:fb,best:fb[0]||null,rec:false};
}

var PROMPT_FAT="Analisa esta imagem ou PDF de uma fatura de compra de um restaurante em Portugal. Se o documento tiver varias paginas, le TODAS as paginas com atencao, por ordem, e junta o resultado. Se for digitalizado, le o texto visivel com cuidado. Extrai TODOS os produtos comprados. Regras: numeros com ponto decimal, sem simbolo de euro; a descricao deve ser o texto EXATO da fatura; se nao tiveres certeza escreve null; ignora nas linhas tudo o que nao seja produto (IVA, subtotais, totais, descontos, pagamentos, moradas, NIF); data no formato AAAA-MM-DD; devolve numero do documento, base tributavel, IVA e total com IVA. Para cada linha devolve tambem quantidade (unidades compradas), preco_pack (preco pago por UMA unidade comprada), total_linha, unidade_emb (KG, G, L, ML, UN, CX) e conteudo (quanto da unidade base tem cada unidade comprada: 1 para 1 L, 0.5 para 500 ML, 12 para 12 X 1 L, 6 para CX 6 UN). Responde APENAS com JSON: {\"fornecedor\":\"\",\"data\":\"AAAA-MM-DD\",\"numero\":\"\",\"base\":0,\"iva\":0,\"total\":0,\"linhas\":[{\"descricao\":\"\",\"quantidade\":1,\"preco_pack\":0,\"total_linha\":0,\"unidade_emb\":\"\",\"conteudo\":1}]}";
function parseJSONTolerant(t){
  var s=String(t||"").trim();
  s=s.replace(/^```json/i,"").replace(/```$/,"").trim();
  try{return JSON.parse(s);}catch(e){}
  var i=s.indexOf("{"),j=s.lastIndexOf("}");
  if(i>=0&&j>i){try{return JSON.parse(s.slice(i,j+1));}catch(e2){}}
  return null;
}
function matchArtigo(desc){
  var a=toks(desc);
  if(!a.length)return {n:null,s:0};
  var nd=normTxt(desc),best=null,bs=0;
  ativos().forEach(function(i){
    var b=toks(i.n);
    if(!b.length)return;
    var w=0,others=0,firstHit=false;
    for(var bi=0;bi<b.length;bi++){
      var tk=b[bi],found=false;
      for(var q=0;q<a.length;q++){
        if(a[q]===tk){found=true;break;}
        if(a[q].length>3&&tk.length>3&&(a[q].indexOf(tk)===0||tk.indexOf(a[q])===0)){found=true;break;}
      }
      if(found){if(bi===0){firstHit=true;w+=1;}else{others++;w+=1.2;}}
    }
    var sc=w/b.length;
    if(nd.indexOf(normTxt(i.n))>=0)sc=1;
    if(!firstHit&&others<2)sc=sc*0.45;
    if(sc>bs){bs=sc;best=i.n;}
  });
  return {n:bs>=0.5?best:null,s:bs};
}

function gravarFatura(){
  var lin=st.ia.lin||[],n=0,soma=0,fatId=newFatId();
  var fatBase=Number(st.ia.base)||0,fatIva=Number(st.ia.iva)||0;
  var taxa=fatBase>0?fatIva/fatBase:0.23;
  lin.forEach(function(l){
    if(!l.ok||!l.art)return;
    var ing=BYNAME[l.art];
    if(!ing)return;
    var q=Number(l.qtd)||0;
    var cont=Number(l.cont)||1;
    var ub=l.ub||ing.u||"un";
    var tot=(Number(l.tot)>0)?Number(l.tot):(q*(Number(l.pp)||0));
    var pbase=precoPorBase(tot,q,cont);
    if(!(pbase>0))return;
    var d=st.ia.data||hoje();
    soma+=tot;
    var baseLin=tot/(1+taxa);
    var ivaLin=tot-baseLin;
    (HIST[ing.id]=HIST[ing.id]||[]).push({d:d,p:pbase,s:st.ia.forn,f:"Fatura (IA)"});
    HIST[ing.id].sort(function(x,y){return x.d.localeCompare(y.d);});
    COMPRAS.push({n:ing.n,q:q,u:ub,t:tot,p:pbase,pp:Number(l.pp)||0,cont:cont,s:st.ia.forn,d:d,fat:fatId,
      b:Math.round(baseLin*100)/100,iv:Math.round(ivaLin*100)/100});
    dbUpPreco(ing.n,d,pbase,st.ia.forn,"Fatura (IA)");
    dbUpCompra({artigo:ing.n,data:d,qtd:q,unidade:ub,total:tot,preco_unit:pbase,fornecedor:st.ia.forn});
    if(ing.custom)dbUpArtigo(ing);
    n++;
  });
  var tot=st.ia.tot>0?st.ia.tot:soma;
  var base=fatBase>0?fatBase:Math.max(0,tot-fatIva);
  var fotosPag=[];
  (st.paginas||[]).forEach(function(p){if(p&&!p.pdf&&p.url)fotosPag.push(p.url);});
  var fat={id:fatId,data:st.ia.data||hoje(),forn:st.ia.forn,num:st.ia.num||"",
    base:base,iva:fatIva,total:tot,n:n,temFoto:fotosPag.length>0,fotoUrl:"",fotos:[],nFotos:fotosPag.length,
    fonte:"IA",sync:false};
  FATURAS.push(fat);
  var fornAnt=st.ia.forn;
  st.ia={busy:false,err:"",lin:null,forn:fornAnt,novo:"",data:"",num:"",base:0,iva:0,tot:0,
    msg:(n?("✔ "+n+" linhas gravadas. A enviar a fatura para a nuvem…"):"Nada foi gravado (nenhuma linha marcada)."),pick:null,pq:"",newArt:null};
  st.paginas=[];
  save();render();
  (async function(){
    for(var i=0;i<fotosPag.length;i++){
      var comp=await comprimirP(fotosPag[i]);
      if(!comp)continue;
      var url=await guardarFotoFatura(fat.id,comp,i);
      fat.fotos[i]=url||null;
      if(i===0&&url)fat.fotoUrl=url;
    }
    var ok=await dbUpFatura(fat);
    if(ok)fat.sync=true;
    st.ia.msg=ok?("✔ Fatura de "+dmy(fat.data)+" gravada na nuvem."+(fat.nFotos?" "+fat.nFotos+" foto(s)":""))
      :"⚠️ Gravada só no telemóvel (Configuração → reenviar).";
    save();render();
  })();
}

function normNum(s){return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");}
function acharDuplicado(nomeForn,num,total){
  var nn=normNum(num);
  if(!nn)return null;
  var alvo=String(nomeForn||"").trim().toUpperCase(),achou=null;
  FATURAS.forEach(function(f){
    if(normNum(f.num)!==nn)return;
    var fn=String(SUP[f.forn]||f.forn||"").trim().toUpperCase();
    if(alvo&&fn&&alvo!==fn)return;
    achou=f;
  });
  if(achou)return achou;
  if(typeof total==="number"&&total>0){
    FATURAS.forEach(function(f){if(normNum(f.num)!==nn)return;if(Math.abs((Number(f.total)||0)-total)<0.02)achou=f;});
  }
  return achou;
}

function chart(pts,unit,demo){
  if(!pts||pts.length<2)return '<div class="empty">Ainda só existe 1 registo de preço.<br>Registe novas compras para ver a evolução.</div>';
  var w=320,h=132,pl=34,pr=12,pt2=14,pb=22;
  var ps=pts.map(function(p){return p.p;});
  var mn=Math.min.apply(null,ps),mx=Math.max.apply(null,ps),sp=(mx-mn)||(mx||1);
  function X(i){return pl+(w-pl-pr)*(i/(pts.length-1));}
  function Y(v){return h-pb-(h-pt2-pb)*((v-mn)/sp);}
  var d="";
  pts.forEach(function(p,i){d+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.p).toFixed(1)+" ";});
  var ar="M"+X(0).toFixed(1)+" "+(h-pb)+" "+d.trim().replace(/^M/,"L")+" L"+X(pts.length-1).toFixed(1)+" "+(h-pb)+" Z";
  var dots="";
  pts.forEach(function(p,i){dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.p).toFixed(1)+'" r="'+(i===pts.length-1?4.5:3)+'" fill="'+(i===pts.length-1?"#0f766e":"#fff")+'" stroke="#0f766e" stroke-width="2"/>';});
  var grid=[0,0.5,1].map(function(k){var v=mn+sp*k;
    return '<line x1="'+pl+'" y1="'+Y(v).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(v).toFixed(1)+'" stroke="#eef0f3"/><text x="'+(pl-6)+'" y="'+(Y(v)+3.5).toFixed(1)+'" font-size="9" fill="#9ca3af" text-anchor="end">'+String(Math.round(v*100)/100).replace(".",",")+'</text>';}).join("");
  var first=pts[0],lastp=pts[pts.length-1];
  var varp=first.p>0?((lastp.p-first.p)/first.p*100):0;
  var cor=varp>0?"#b91c1c":(varp<0?"#15803d":"#6b7280");
  return '<div class="row between small" style="margin-bottom:4px"><span class="mut">Evolução ('+pts.length+' registos'+(demo?' · <b>exemplo</b>':'')+')</span><span class="b" style="color:'+cor+'">'+(varp>0?"+":"")+pct(varp)+'</span></div>'+
   '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">'+grid+
   '<path d="'+ar+'" fill="rgba(15,118,110,.10)"/>'+
   '<path d="'+d.trim()+'" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
   dots+'<text x="'+pl+'" y="'+(h-6)+'" font-size="9" fill="#9ca3af">'+dmy(first.d)+'</text>'+
   '<text x="'+(w-pr)+'" y="'+(h-6)+'" font-size="9" fill="#9ca3af" text-anchor="end">'+dmy(lastp.d)+'</text></svg>';
}

function convBox(l,i,art){
  var totL=(Number(l.tot)>0)?Number(l.tot):((Number(l.qtd)||0)*(Number(l.pp)||0));
  var dif=art&&art.pk!==Number(l.cont);
  var out='<div class="convbox"><div class="tiny mut mb8">📏 Conversão de unidades — ajusta se a fatura estiver ambígua</div>';
  out+='<div class="cw mb8"><div><label class="f">Qtd comprada</label>'+decInput("",l.qtd,"",'data-act="iaqtd" data-v="'+i+'" min="0"')+'</div>';
  out+='<div><label class="f">€ por un. comprada</label>'+decInput("",l.pp,"",'data-act="iapp" data-v="'+i+'" min="0"')+'</div></div>';
  out+='<div class="cw3"><div><label class="f">1 un. =</label>'+decInput("",l.cont,"",'data-act="iacont" data-v="'+i+'" min="0"')+'</div>';
  out+='<div><label class="f">Unidade</label><select data-act="iaun" data-v="'+i+'">'+unitOpts(l.ub)+'</select></div>';
  out+='<div><label class="f">Total pago</label>'+decInput("",totL,"",'data-act="iatot" data-v="'+i+'" min="0"')+'</div></div>';
  out+='<div class="res">'+(l.pu>0?eur(l.pu)+' por '+l.ub:'—');
  if(dif)out+=' <span style="color:#b45309">(artigo usa '+qtd(art.pk)+' '+uP(art.u)+')</span>';
  out+='</div>';
  out+='<button class="btn ghost sm mt8" data-act="iaapplyemb" data-v="'+i+'" style="width:100%">🧾 Usar esta embalagem no artigo</button></div>';
  return out;
}

function ingredientesTodasFichas(){
  var map={},ord=[];
  FICHAS.forEach(function(f){
    f.lin.forEach(function(l){
      if(!map[l[0]]){map[l[0]]={n:l[0],q:0};ord.push(l[0]);}
      map[l[0]].q+=Number(l[1])||0;
    });
  });
  return ord.map(function(k){return map[k];});
}
function fichaAddItens(){
  var fa=st.fichaAdd;
  if(fa.ficha==null)return [];
  if(fa.ficha===-1)return ingredientesTodasFichas();
  var f=fichaById(fa.ficha);
  if(!f)return [];
  return f.lin.map(function(l){return {n:l[0],q:Number(l[1])||0};});
}

async function apagarPrecoNuvem(artigo,data,preco,fonte){
  if(!dbOn())return;
  return db("precos?select=id,artigo,data,preco,fonte&artigo=eq."+encodeURIComponent(artigo)+"&data=eq."+encodeURIComponent(data))
  .then(function(rows){
    var alvos=(rows||[]).filter(function(r){
      if(Math.abs((Number(r.preco)||0)-(Number(preco)||0))>0.0001)return false;
      if(fonte)return (r.fonte||"")===fonte;
      var ff=String(r.fonte||"");
      return ff.indexOf("CATALOGO:")!==0&&ff.indexOf("ALIAS:")!==0&&ff.indexOf("MERGED:")!==0;
    });
    return alvos.reduce(function(p,r){return p.then(function(){return dbDel("precos?id=eq."+r.id);});},Promise.resolve());
  }).catch(function(){});
}
async function apagarCompraNuvem(c){
  if(!dbOn())return;
  return db("compras?select=id,artigo,data,qtd,total,preco_unit&artigo=eq."+encodeURIComponent(c.n)+"&data=eq."+encodeURIComponent(c.d))
  .then(function(rows){
    var alvos=(rows||[]).filter(function(r){
      if(Math.abs((Number(r.qtd)||0)-(Number(c.q)||0))>0.001)return false;
      if(Math.abs((Number(r.total)||0)-(Number(c.t)||0))>0.02)return false;
      return true;
    });
    return alvos.reduce(function(p,r){return p.then(function(){return dbDel("compras?id=eq."+r.id);});},Promise.resolve());
  }).catch(function(){});
}
async function apagarFaturaNuvem(f,compras){
  if(!dbOn())return;
  var q="data=eq."+encodeURIComponent(f.data)+"&fornecedor=eq."+encodeURIComponent(SUP[f.forn]||f.forn||"");
  if(f.num)q+="&numero=eq."+encodeURIComponent(f.num);
  if(Number(f.total)>0)q+="&total=eq."+Number(f.total);
  try{
    var rows=await db("faturas?select=id,data,fornecedor,numero,total&"+q);
    for(var i=0;i<(rows||[]).length;i++)await dbDel("faturas?id=eq."+rows[i].id);
  }catch(e){}
  for(var j=0;j<compras.length;j++){
    await apagarCompraNuvem(compras[j]);
    await apagarPrecoNuvem(compras[j].n,compras[j].d,compras[j].p,"Fatura (IA)");
  }
}
function apagarCompra(idx){
  var c=COMPRAS[idx];
  if(!c)return;
  COMPRAS.splice(idx,1);
  var ing=BYNAME[c.n];
  if(ing&&HIST[ing.id]){
    var hh=HIST[ing.id];
    for(var k=hh.length-1;k>=0;k--){
      if(hh[k].d===c.d&&Math.abs(hh[k].p-(Number(c.p)||0))<0.0001&&(hh[k].s||"")===(c.s||"")&&String(hh[k].f||"").indexOf("Lista de compras")!==0){
        hh.splice(k,1);break;
      }
    }
    if(!hh.length)delete HIST[ing.id];
  }
  st.pend=null;
  st.bkmsg="✔ Compra apagada: "+c.n;
  save();render();
  apagarCompraNuvem(c);
  apagarPrecoNuvem(c.n,c.d,c.p,"Fatura");
}

    var ing=BYNAME[c.n];
    if(ing&&HIST[ing.id]){
      var hh=HIST[ing.id];
      for(var k=hh.length-1;k>=0;k--){
        if(hh[k].d===c.d&&Math.abs(hh[k].p-(Number(c.p)||0))<0.0001&&(hh[k].s||"")===(c.s||"")&&String(hh[k].f||"").indexOf("Fatura (IA)")===0){
          hh.splice(k,1);break;
        }
      }
      if(!hh.length)delete HIST[ing.id];
    }
  });
  COMPRAS=COMPRAS.filter(function(c){return lig.indexOf(c)<0;});
  FATURAS=FATURAS.filter(function(x){return x.id!==id;});
  st.pend=null;st.openFat=null;st.fotoAtual=null;st.fatFotos=[];st.zoom=null;
  st.bkmsg="✔ Fatura apagada ("+lig.length+" compra(s) removidas e preços revertidos).";

  (async function(){

  })();

      (async function(){

          for(var i=0;i<MAXFOTOS;i++){

            var url=await guardarFotoFatura(f6.id,loc,i);

            n++;
          }
          f6.fotos=urls;

      break;
    }

      var falta=FATURAS.filter(function(f){return !f.sync;});
      if(!falta.length){st.bkmsg="Está tudo sincronizado.";render();break;}
      st.bkmsg="A reenviar "+falta.length+" fatura(s)…";render();
      (async function(){
        var n=0;
        for(var k=0;k<falta.length;k++){
          var ok=await dbUpFatura(falta[k]);
          if(ok){falta[k].sync=true;n++;}
        }
        st.bkmsg="🔄 "+n+" de "+falta.length+" faturas sincronizadas.";
        save();render();
      })();
      break;
    }
  }
});

document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var el=e.target;
  if(!el||!el.getAttribute)return;
  var ac=el.getAttribute("data-enter");
  if(!ac)return;
  e.preventDefault();
  var idx=el.getAttribute("data-i");
  var all=document.querySelectorAll('[data-act="'+ac+'"]');
  for(var i=0;i<all.length;i++){
    if(all[i].getAttribute("data-i")===idx){all[i].click();return;}
  }
  render();
});

    return;
  }
  if(id==="naUn"||id==="naCont"||id==="naPreco"){
    var nu=document.getElementById("naUn");
    var nc=document.getElementById("naCont");
    var np=document.getElementById("naPreco");
    var nres=document.getElementById("naRes");
    if(nres&&nu&&nc&&np){
      var c2=parseNum(nc.value);
      var p2=parseNum(np.value);
      nres.textContent="1 un = "+qtd(c2)+" "+normalizarUnidade(nu.value)+" → "+(c2>0?eur(p2/c2):"—")+" / "+normalizarUnidade(nu.value);
    }
    return;
  }
  if((id==="invFile"||id==="camFile")&&e.target.files&&e.target.files.length){
    adicionarPaginas(e.target.files);
    try{e.target.value="";}catch(x){}
  }
});

function adicionarPaginas(fileList){
  if(!st.paginas)st.paginas=[];
  var ficheiros=Array.prototype.slice.call(fileList);
  var espaco=MAXFOTOS-st.paginas.length;
  if(espaco<=0){st.ia.err="Máximo de "+MAXFOTOS+" páginas por fatura.";render();return;}
  ficheiros=ficheiros.slice(0,espaco);
  st.ia.lin=null;st.ia.err="";st.ia.msg="";
  var pend=ficheiros.length;
  function fim(){
    pend--;
    if(pend>0)return;
    if(!st.paginas.length)st.ia.err="Não consegui ler os ficheiros escolhidos.";
    render();
  }
  ficheiros.forEach(function(file){
    var isPdf=(file.type==="application/pdf"||/\.pdf$/i.test(file.name||""));
    if(isPdf){
      st.paginas.push({url:null,mime:"application/pdf",nome:file.name||"PDF",pdf:true,file:file});
      fim();
      return;
    }
    var r=new FileReader();
    r.onload=function(){
      var dataUrl=r.result;
      comprimirFoto(dataUrl,function(url){
        if(url)st.paginas.push({url:url,b64:url.split(",")[1]||"",mime:"image/jpeg",nome:"Página",pdf:false});
        fim();
      });
    };
    r.readAsDataURL(file);
  });
}

function carregarStor(){
  if(st.stor)return;
  (async function(){
    var e=null;
    try{if(navigator.storage&&navigator.storage.estimate)e=await navigator.storage.estimate();}catch(x){}
    st.stor={uso:(e&&e.usage)||0,quota:(e&&e.quota)||0};
    render();
  })();
}

dbLoadCfg();
fornLoad();
aliasLoad();
load();
migVals();migCvals();migCompras();
normFichas();
st.form.iva=CFGP.ivaCompra;
try{
  var _u=JSON.parse(store.get("mammamia_fotourl")||"{}");
  Object.keys(_u).forEach(function(k){FOTOS_URL[k]=_u[k];});
}catch(e){}
try{
  render();
}catch(err){
  document.getElementById("view").innerHTML='<div class="note">⚠️ Erro ao iniciar: '+esc(err.message)+'</div>';
}
if(dbOn())dbPull(true);
</script>
