<title>Mammamia · Gestão de Compras</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f5f7;--card:#fff;--ink:#131820;--mut:#6b7280;--line:#e5e7eb;--acc:#0f766e;--accbg:#ecfdf5;--red:#b91c1c;--redbg:#fef2f2;--amb:#b45309;--ambbg:#fffbeb;--blu:#1d4ed8;--blubg:#eff6ff}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;padding-bottom:26px}
header{position:sticky;top:0;z-index:30;background:#0f2e2b;color:#fff;padding:11px 13px 10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header h1{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1 span.em{font-size:18px}
#ver{font-size:9.5px;font-weight:700;background:rgba(255,255,255,.16);padding:2px 6px;border-radius:6px}
header .sub{font-size:11px;opacity:.72;margin-top:2px}
nav.tabs{display:flex;gap:3px;margin-top:9px;background:rgba(255,255,255,.09);border-radius:12px;padding:4px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;font-weight:600;color:rgba(255,255,255,.72);padding:6px 1px;border-radius:9px;line-height:1.1}
nav.tabs button .e{font-size:15px;line-height:1}
nav.tabs button.on{background:#fff;color:#0f2e2b;font-weight:800}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card.tight{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mut{color:var(--mut)}.small{font-size:12px}.tiny{font-size:11px}.b{font-weight:700}
input,select,button,textarea{font-family:inherit;font-size:16px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #99f6e4;border-color:var(--acc)}
button{cursor:pointer;border:0;background:none;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--acc);color:#fff;border-radius:11px;padding:12px 14px;font-weight:600;width:100%;font-size:15px}
.btn.ghost{background:#fff;color:var(--acc);border:1px solid #cbd5d3}
.btn.grey{background:#eef0f3;color:#374151}
.btn.danger{background:var(--redbg);color:var(--red);border:1px solid #fecaca}
.btn.sm{width:auto;padding:8px 12px;font-size:13.5px;border-radius:9px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:#374151;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid #f1f2f4;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0}
.item .nm .n{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm .m{font-size:11.5px;color:var(--mut);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .pr{text-align:right;flex:0 0 auto}
.item .pr .p{font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px}
.item .pr .u{font-size:11px;color:var(--mut)}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:600}
.bdg-g{background:var(--accbg);color:var(--acc)}.bdg-a{background:var(--ambbg);color:var(--amb)}
.bdg-r{background:var(--redbg);color:var(--red)}.bdg-b{background:var(--blubg);color:var(--blu)}
.bdg-m{background:#ede9fe;color:#6d28d9}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding-bottom:100px}
.sheet .top{position:sticky;top:0;background:#0f2e2b;color:#fff;padding:11px 14px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .top .t{flex:1;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{background:rgba(255,255,255,.15);border-radius:9px;padding:7px 11px;color:#fff;font-weight:700;font-size:14px}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp td{padding:7px 4px;border-bottom:1px solid #f1f2f4}
table.cmp tr:last-child td{border-bottom:0}
table.cmp td.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
tr.best td{background:var(--accbg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.empty{padding:22px 14px;text-align:center;color:var(--mut);font-size:13px}
.note{background:var(--ambbg);border:1px solid #fde68a;color:#92400e;border-radius:11px;padding:9px 11px;font-size:12px;margin-bottom:10px}
.note.b{background:var(--blubg);border-color:#bfdbfe;color:#1e40af}
.note.g{background:var(--accbg);border-color:#a7f3d0;color:#065f46}
.note.r{background:var(--redbg);border-color:#fecaca;color:#b91c1c}
.note.p{background:#f5f3ff;border-color:#ddd6fe;color:#5b21b6}
.line{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #f1f2f4}
.line input[type=number]{width:76px;text-align:right;padding:7px 8px}
.line .nm{flex:1;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .ct{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--mut);min-width:56px;text-align:right}
.rm{color:#9ca3af;font-size:17px;padding:2px 4px}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
.tot.big{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.tot label{color:#4b5563}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:block;font-size:11.5px;color:var(--mut);margin:0 0 4px 2px;font-weight:600}
.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mt8{margin-top:8px}.mt10{margin-top:10px}
.pick{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;background:#fff}
.pick button{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid #f1f2f4;font-size:13.5px}
.pick button:last-child{border-bottom:0}
.pill{font-size:11px;background:#f1f2f4;color:#374151;border-radius:6px;padding:2px 7px;font-weight:600}
.loja{border:1px solid #d1fae5;background:#f0fdfa;border-radius:11px;padding:9px 11px;margin-bottom:8px}
.loja .lh{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.loja .li{font-size:11.5px;color:#065f46;margin-top:3px;line-height:1.5}
.fat{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #f1f2f4;width:100%;text-align:left}
.fat:last-child{border-bottom:0}
.fat .th{width:40px;height:40px;border-radius:9px;background:#f1f2f4;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto;overflow:hidden}
.fat .in{flex:1;min-width:0}.fat .in .d{font-weight:700;font-size:13.5px}.fat .in .s{font-size:11px;color:var(--mut);margin-top:1px}
.fat .vl{text-align:right;flex:0 0 auto}.fat .vl .t{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}.fat .vl .i{font-size:10.5px;color:var(--mut)}
.delbtn{background:var(--redbg);color:var(--red);border:1px solid #fecaca;border-radius:9px;padding:6px 9px;font-size:13px;font-weight:700;flex:0 0 auto}
.delbar{background:var(--redbg);border:1px solid #fecaca;color:#b91c1c;border-radius:11px;padding:9px 11px;font-size:12.5px;margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crebtn{background:var(--acc);color:#fff;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:700}
.aliaspill{background:#ecfdf5;color:#0f766e;border:1px solid #a7f3d0;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:700}
.convbox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;padding:9px;margin-top:7px}
.convbox .cw{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.convbox .cw3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.convbox input[type=number],.convbox select{padding:7px 8px;font-size:15px}
.res{background:var(--accbg);border:1px solid #a7f3d0;color:#065f46;border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:700;margin-top:7px;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #a7f3d0;border-top-color:#0f766e;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.mlist{font-size:11.5px;line-height:1.6;color:#374151;word-break:break-word}
.mlist .ok{color:#15803d;font-weight:700}
.mlist .no{color:#b91c1c}
</style>
</head>

/* ===================== UNIDADES E EMBALAGENS ===================== */
function convValor(valor,de,para){
  var v=parseFloat(String(valor==null?"":valor).replace(",","."));
  if(isNaN(v))return 0;
  var d=String(de||"").toLowerCase(),p=String(para||"").toLowerCase();
  if(!p||d===p)return v;
  if(p==="L"){
    if(d==="ml")return v/1000;
    if(d==="cl")return v/100;
    if(d==="dl")return v/10;
    return v;
  }
  if(p==="kg"){
    if(d==="g")return v/1000;
    if(d==="mg")return v/1000000;
    if(d==="ml")return v/1000;
    return v;
  }
  return v;
}
function parseEmbalagem(desc){
  var s=String(desc||"").toLowerCase(),res={cont:0,un:""},m;
  m=s.match(/(\d+)\s*[x×]\s*(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml|un|unid|dz)\b/);
  if(m){res.cont=parseFloat(m[2].replace(",","."))*(parseInt(m[1],10)||1);res.un=m[3];return res;}
  m=s.match(/(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml|un|unid|dz)\b/);
  if(m){res.cont=parseFloat(m[1].replace(",","."));res.un=m[2];return res;}
  m=s.match(/\b(cx|caixa|caja|pack)\s*(?:de\s*)?(\d+)/);
  if(m){res.cont=parseInt(m[2],10);res.un="un";return res;}
  return res;
}
function precoPorBase(total,qtd,cont){
  var un=(Number(qtd)||0)*(Number(cont)||0);
  if(!(un>0))return 0;
  var t=Number(total)||0;
  if(!(t>0))return 0;
  return t/un;
}
function normalizarUnidade(v){
  var t=String(v||"").toLowerCase();
  if(t==="kg"||t==="quilo"||t==="quilos")return "kg";
  if(t==="l"||t==="lt"||t==="litro"||t==="litros")return "L";
  if(t==="dz"||t==="dzena"||t==="dzenas"||t==="ovo"||t==="ovos")return "dz";
  if(t==="un"||t==="unidade"||t==="unidades"||t==="un.")return "un";
  return String(v||"un").trim()||"un";
}
function inferUnidade(desc,unidade){
  var t=String(unidade||"").toLowerCase();
  if(/(^|\s)kg(\s|$)|quilo/.test(t))return "kg";
  if(/(^|\s)l(\s|$)|litro/.test(t))return "L";
  if(/(^|\s)dz(\s|$)|dzena|ovo/.test(t))return "dz";
  var e=parseEmbalagem(desc);
  if(e.cont>0){
    if(e.un==="kg"||e.un==="g")return "kg";
    if(e.un==="l"||e.un==="ml")return "L";
    if(e.un==="dz")return "dz";
  }
  return "un";
}
function inferCategoria(nome){
  var t=String(nome||"").toLowerCase();
  if(/(carne|chouri|chourico|frango|porco|bacon|salsicha|fiambre|peito de peru|perna de frango|alheira|chanfana|entrecosto|secreto)/.test(t))return "carn";
  if(/(bacalhau|peixe|pescada|atum|salmao|salmon)/.test(t))return "peix";
  if(/(alface|batata|cebola|cenoura|tomate|couve|lima|banana|abacaxi|fruta|horta|rucula|agriao)/.test(t))return "hort";
  if(/(leite|nata|queijo|iogurte|ovos|ovo|manteiga|margarina)/.test(t))return "lact";
  if(/(congelad|batata frita|risole|frutos silvestres|morango congelado|filete)/.test(t))return "cong";
  if(/(pao|pão|farinha de trigo tipo 55|bolacha|biscoito|bolo|pastel)/.test(t))return "pad";
  if(/(cerveja|vinho|agua|água|sumo|refri|licor|cachaca|cachaça|gasosa)/.test(t))return "beb";

}

var ALIAS={};
function aliasCands(desc){
  var t=toks(desc).filter(function(w){return !/^\d+([.,]\d+)?$/.test(w);});
  var out=[];
  for(var n=1;n<=Math.min(4,t.length);n++){
    var k=t.slice(0,n).join(" ");
    if(out.indexOf(k)<0)out.push(k);
  }
  var full=normTxt(desc);
  if(full&&out.indexOf(full)<0)out.push(full);
  return out;
}
function aliasCandsLongas(desc){
  var t=toks(desc).filter(function(w){return !/^\d+([.,]\d+)?$/.test(w);});
  var out=[];
  for(var n=2;n<=Math.min(4,t.length);n++){
    var k=t.slice(0,n).join(" ");
    if(out.indexOf(k)<0)out.push(k);
  }
  var full=normTxt(desc);
  if(t.length>=2&&full&&out.indexOf(full)<0)out.push(full);
  return out;
}
function aliasFind(desc){
  var cs=aliasCands(desc);
  for(var i=cs.length-1;i>=0;i--){
    var a=ALIAS[cs[i]];
    if(a&&a.artigo&&BYNAME[a.artigo])return {k:cs[i],rec:a};
  }
  return null;
}

var FOTOS_MEM={},FOTOS_URL={},idbDb=null;
function idbOpen(){return new Promise(function(res,rej){try{
  if(!window.indexedDB)throw new Error("sem indexedDB");
  var r=indexedDB.open("mammamia_fotos",1);
  r.onupgradeneeded=function(){var db=r.result;if(!db.objectStoreNames.contains("fotos"))db.createObjectStore("fotos");};
  r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};
}catch(e){rej(e);}});}
function idbOp(mode,fn){return (async function(){
  try{
    if(!idbDb)idbDb=await idbOpen();
    await new Promise(function(ok,no){
      var tx=idbDb.transaction("fotos",mode);
      fn(tx.objectStore("fotos"));
      tx.oncomplete=function(){ok();};tx.onerror=function(){no(tx.error);};
    });
    return true;
  }catch(e){return false;}
})();}
function fotoLocalPut(k,d){return idbOp("readwrite",function(os){os.put(d,k);}).then(function(ok){if(!ok)FOTOS_MEM[k]=d;return ok;});}
function fotoLocalGet(k){return idbOp("readonly",function(os){var r=os.get(k);r.onsuccess=function(){FOTOS_MEM[k]=FOTOS_MEM[k]||r.result||null;};}).then(function(){return FOTOS_MEM[k]||null;});}
function fotoLocalDel(k){delete FOTOS_MEM[k];return idbOp("readwrite",function(os){os.delete(k);});}
function fotoGet(k){return fotoLocalGet(k).then(function(l){return l||FOTOS_URL[k]||null;});}
function dataUrlToBlob(dataUrl){
  try{
    var p=dataUrl.split(",");
    var mime=(p[0].match(/:(.*?);/)||[])[1]||"image/jpeg";
    var bin=atob(p[1]),len=bin.length,arr=new Uint8Array(len);
    for(var i=0;i<len;i++)arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});
  }catch(e){return null;}
}

/* ===================== UNIFICAR ARTIGOS ===================== */
function unificarArtigos(masterId,ids){
  var master=ING[masterId];
  if(!master)return {n:0,precos:0};
  var n=0,np=0;
  ids.forEach(function(id){
    var a=ING[id];
    if(!a||a===master)return;
    var hm=HIST[a.id]||[];
    if(hm.length){
      if(!HIST[master.id])HIST[master.id]=[];
      HIST[master.id]=HIST[master.id].concat(hm);
      HIST[master.id].sort(function(x,y){return x.d.localeCompare(y.d);});
      np+=hm.length;
    }
    delete HIST[a.id];
    COMPRAS.forEach(function(c){if(c.n===a.n)c.n=master.n;});
    FICHAS.forEach(function(f){f.lin.forEach(function(l){if(l[0]===a.n)l[0]=master.n;});});
    var cs=aliasCandsLongas(a.n);
    cs.forEach(function(k){if(k)ALIAS[k]={artigo:master.n,desc:a.n,quando:hoje()};});
    if(!cs.length)ALIAS[normTxt(a.n)]={artigo:master.n,desc:a.n,quando:hoje()};
    MERGED[a.n]=master.n;
    delete BYNAME[a.n];
    var cx=CUSTOM.indexOf(a);if(cx>=0)CUSTOM.splice(cx,1);
    var ix=ING.indexOf(a);if(ix>=0)ING.splice(ix,1);
    cs.forEach(function(k){if(k)dbUpAlias(k,ALIAS[k]);});
    dbDelPrecosArtigo(a.n);
    dbMarcarUniao(a.n,master.n);
    n++;
  });
  if(master.custom)dbUpArtigo(master);
  (HIST[master.id]||[]).forEach(function(h){
    if(h.f==="Exemplo (demonstração)")return;
    dbUpPreco(master.n,h.d,h.p,h.s,h.f||"Unificação");
  });
  save();
  return {n:n,precos:np};
}

/* ===================== GEMINI: PDF VIA FILES API ===================== */
function b64ToBytes(b64){
  var bin=atob(b64||"");
  var arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return arr;
}
async function geminiUploadFile(file,key){
  var fd=new FormData();
  fd.append("file",file,file.name||"fatura.pdf");
  fd.append("metadata",JSON.stringify({file:{display_name:file.name||"fatura.pdf"}}));
  var r=await fetch(GEM+"/upload/v1beta/files?key="+encodeURIComponent(key),{method:"POST",body:fd});
  var txt=await r.text();
  if(!r.ok)throw new Error((txt||("HTTP "+r.status)).slice(0,200));
  var j=JSON.parse(txt);
  if(!j.file)throw new Error("resposta sem ficheiro");
  return j.file;
}
async function geminiWaitFile(file,key){
  var nm=String(file.name||"").replace(/^files\//,"");
  var url=GEM+"/v1beta/files/"+nm+"?key="+encodeURIComponent(key);
  for(var i=0;i<120;i++){
    var r=await fetch(url);
    if(!r.ok)throw new Error("estado HTTP "+r.status);
    var j=await r.json();
    if(j.state==="ACTIVE")return j;
    if(j.state==="FAILED")throw new Error((j.error&&j.error.message)||"processamento falhou");
    await new Promise(function(res){setTimeout(res,1500);});
  }
  throw new Error("tempo esgotado a processar o ficheiro");
}
async function parteParaPagina(p,key){
  if(!p.pdf)return {inline_data:{mime_type:p.mime||"image/jpeg",data:p.b64||""}};
  var bytes=null;
  if(p.file&&p.file.arrayBuffer)bytes=new Uint8Array(await p.file.arrayBuffer());
  else if(p.b64)bytes=b64ToBytes(p.b64);
  if(!bytes||!bytes.length)throw new Error("PDF vazio");
  var nome=p.nome||"fatura.pdf";
  var file=null,erro=null;
  try{
    file=await geminiUploadFile(new Blob([bytes],{type:"application/pdf"}),key);
    if(!file.uri)file.uri=GEM+"/v1beta/files/"+String(file.name||"").replace(/^files\//,"");
  }catch(e){erro=e;}
  if(file){
    try{
      var act=await geminiWaitFile(file,key);
      return {file_data:{mime_type:"application/pdf",file_uri:act.uri||file.uri||file.name}};
    }catch(e){erro=e;}
  }
  if(bytes.length<13000000){
    var chunk=0x8000,arr=[];
    for(var j=0;j<bytes.length;j+=chunk)arr.push(String.fromCharCode.apply(null,bytes.subarray(j,j+chunk)));
    return {inline_data:{mime_type:"application/pdf",data:btoa(arr.join(""))}};
  }
  throw new Error((erro&&erro.message)||"não consegui enviar o PDF");
}

/* ===================== PREÇO POR FORNECEDOR (30 dias) ===================== */
function dataLimite(dias){var d=new Date();d.setDate(d.getDate()-(dias||30));return d.toISOString().slice(0,10);}
function precoRecente(i,dias){
  if(!i)return {opts:[],best:null,rec:false};
  var lim=dataLimite(dias||30);
  var h=(HIST[i.id]||[]).filter(function(x){return x.d>=lim&&x.p>0;});
  var porSup={};
  h.forEach(function(x){var s=x.s||"?";if(!porSup[s]||x.d>porSup[s].d)porSup[s]={p:x.p,d:x.d};});
  var opts=Object.keys(porSup).map(function(s){return {s:s,p:porSup[s].p,d:porSup[s].d};});
  if(opts.length){opts.sort(function(a,b){return a.p-b.p;});return {opts:opts,best:opts[0],rec:true};}
  var fb=[];
  if(i.sup&&i.base>0)fb.push({s:i.sup,p:i.base,d:""});
  Object.keys(i.x||{}).forEach(function(k){if(i.x[k]>0)fb.push({s:k,p:i.x[k]/i.pk,d:""});});
  fb.sort(function(a,b){return a.p-b.p;});
  return {opts:fb,best:fb[0]||null,rec:false};
}

  var a=toks(desc);
  if(!a.length)return {n:null,s:0};
  var nd=normTxt(desc),best=null,bs=0;
  ativos().forEach(function(i){
    var b=toks(i.n);
    if(!b.length)return;
    var w=0,others=0,firstHit=false;
    for(var bi=0;bi<b.length;bi++){
      var tk=b[bi],found=false;
      for(var q=0;q<a.length;q++){
        if(a[q]===tk){found=true;break;}
        if(a[q].length>3&&tk.length>3&&(a[q].indexOf(tk)===0||tk.indexOf(a[q])===0)){found=true;break;}
      }
      if(found){if(bi===0){firstHit=true;w+=1;}else{others++;w+=1.2;}}
    }
    var sc=w/b.length;
    if(nd.indexOf(normTxt(i.n))>=0)sc=1;
    if(!firstHit&&others<2)sc=sc*0.45;
    if(sc>bs){bs=sc;best=i.n;}
  });
  return {n:bs>=0.5?best:null,s:bs};
}

function lerFatura(){

    }catch(pe){

        ?"A chave do Google parece invalida ou sem permissao (o envio do PDF falhou)."

      render();
      return;
    }
    partes.push({text:PROMPT_FAT+" Todas as imagens ou paginas que recebeste pertencem a MESMA fatura: junta as linhas de todas numa unica lista e usa a data e os totais do documento."});
    var body={contents:[{parts:partes}],generationConfig:{temperature:0,maxOutputTokens:8192,responseMimeType:"application/json"}};
    var t0=Date.now();
    var relogio=setInterval(function(){
      var el=document.getElementById("iaTimer");
      if(!el){clearInterval(relogio);return;}
      el.textContent="· "+Math.round((Date.now()-t0)/1000)+"s";
    },500);
    var ok=false,erros=[];
    var lista=listaModelos();
    for(var mi=0;mi<lista.length;mi++){
      var m=lista[mi],ac=null,tmr=null;
      try{
        ac=new AbortController();window.__iaac=ac;
        tmr=setTimeout(function(){try{ac.abort();}catch(e){}},limite);
        st.ia.msg="A ler com "+m+"...";
        render();
        var r=await fetch(GEM+"/v1beta/models/"+m+":generateContent",
          {method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body),signal:ac.signal});
        clearTimeout(tmr);
        var txt=await r.text();
        if(!r.ok){
          var msg=txt;
          try{msg=JSON.parse(txt).error.message||txt;}catch(e){}
          erros.push(m+" → "+msg);
          if(r.status===401||r.status===403)break;
          continue;
        }
        var j=JSON.parse(txt);
        var cand=(j.candidates||[])[0];
        var out=((cand&&cand.content&&cand.content.parts)||[]).map(function(x){return x.text||"";}).join("");
        var dados=parseJSONTolerant(out);
        if(!dados||!dados.linhas||!dados.linhas.length)throw new Error("resposta sem linhas de produtos");
        st.ia.data=(dados.data&&/^\d{4}-\d{2}-\d{2}$/.test(dados.data))?dados.data:hoje();
        var ms=matchSup(dados.fornecedor);
        if(ms){st.ia.forn=ms;st.ia.novo="";}else{st.ia.novo=String(dados.fornecedor||"").trim();}
        st.ia.num=dados.numero||"";
        st.ia.base=Number(dados.base)||0;
        st.ia.iva=Number(dados.iva)||0;
        st.ia.tot=Number(dados.total)||0;
        st.ia.lin=(dados.linhas||[]).map(function(l){
          var desc=String(l.descricao||"");
          var af=aliasFind(desc);
          var viaAlias=!!(af&&BYNAME[af.rec.artigo]);
          var m2=viaAlias?{n:af.rec.artigo,s:1}:matchArtigo(desc);
          var ing=m2.n?BYNAME[m2.n]:null;
          var q=l.quantidade!=null?Number(l.quantidade):0;
          var pp=l.preco_pack!=null?Number(l.preco_pack):0;
          var totL=l.total_linha!=null?Number(l.total_linha):0;
          if(!(totL>0)&&q>0&&pp>0)totL=q*pp;
          if(!(pp>0)&&q>0&&totL>0)pp=totL/q;
          var emb=parseEmbalagem(desc);
          var ub=ing?ing.u:inferUnidade(desc,l.unidade_emb);
          var cont=0;
          if(l.conteudo!=null&&Number(l.conteudo)>0)cont=convValor(Number(l.conteudo),l.unidade_emb||emb.un||ub,ub);
          if(!(cont>0)&&emb.cont>0)cont=convValor(emb.cont,emb.un,ub);
          if(!(cont>0)&&ing)cont=Number(ing.pk)||1;
          if(!(cont>0))cont=1;
          var pbase=precoPorBase(totL,q,cont);
          if(!(pbase>0)&&q>0&&pp>0)pbase=pp/cont;
          var ant=ing?lastPrice(ing.id):0;
          var alt=(ant>0&&pbase>0)?Math.abs(pbase-ant)/ant:0;
          return {desc:desc,qtd:q,pp:pp,tot:totL,cont:cont,ub:ub,pu:pbase,s:m2.s,ant:ant,alt:alt,alias:viaAlias,ok:!!(m2.n&&m2.s>=0.5)};
        });
        ok=true;break;
      }catch(e){
        if(tmr)clearTimeout(tmr);
        erros.push(m+" → "+((e&&e.name==="AbortError")?"tempo esgotado ("+Math.round(limite/1000)+"s)":((e&&e.message)||"erro")));
      }
    }
    clearInterval(relogio);window.__iaac=null;st.ia.busy=false;
    var tr=erros.join(" | ");
    if(!ok){
      var semModelos=/is no longer available|NOT_FOUND|not found|404/i.test(tr);
      if(semModelos)st.ia.err="Nenhum modelo desta lista esta disponivel para a tua conta. Vai a Análise → «Testar modelos» para ver quais tens, ou escolhe o modelo no separador Compras.";
      else if(tr.indexOf("tempo esgotado")>=0)st.ia.err="A leitura nao terminou a tempo. Com PDFs o processamento demora mais - repete ou divide o ficheiro.";
      else if(tr.indexOf("Failed to fetch")>=0||tr.indexOf("NetworkError")>=0||tr.indexOf("load failed")>=0)st.ia.err="Nao consegui falar com o Google - parece falta de internet.";
      else if(tr.indexOf("high demand")>=0||tr.indexOf("overloaded")>=0||tr.indexOf("503")>=0)st.ia.err="Os servidores do Google estao sobrecarregados. Espera 1-2 minutos.";
      else if(tr.indexOf("API key")>=0||tr.indexOf("401")>=0||tr.indexOf("403")>=0||tr.indexOf("PERMISSION")>=0)st.ia.err="A chave do Google parece invalida ou sem permissao.";
      else if(tr.indexOf("quota")>=0||tr.indexOf("429")>=0||tr.indexOf("RESOURCE_EXHAUSTED")>=0)st.ia.err="Atingiste o limite gratuito diario do Google.";
      else if(tr.indexOf("PDF")>=0||tr.indexOf("file")>=0||tr.indexOf("413")>=0)st.ia.err="O PDF nao pode ser lido ("+tr.slice(0,140)+"). Exporta como imagens ou fotografa as paginas.";
      else st.ia.err="A IA nao conseguiu ler a fatura. Detalhe: "+tr.slice(0,220);
    }else if(!st.ia.lin.length){
      st.ia.err="Nao encontrei linhas de produtos. Tenta uma foto de frente, com boa luz, ou exporta o PDF como imagens.";
    }
    render();
  })();
}

/* ===================== DUPLICADOS / EXPORTAÇÃO ===================== */
function normNum(s){return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");}
function acharDuplicado(nomeForn,num,total){
  var nn=normNum(num);
  if(!nn)return null;
  var alvo=String(nomeForn||"").trim().toUpperCase(),achou=null;
  FATURAS.forEach(function(f){
    if(normNum(f.num)!==nn)return;
    var fn=String(SUP[f.forn]||f.forn||"").trim().toUpperCase();
    if(alvo&&fn&&alvo!==fn)return;
    achou=f;
  });
  if(achou)return achou;
  if(typeof total==="number"&&total>0){
    FATURAS.forEach(function(f){if(normNum(f.num)!==nn)return;if(Math.abs((Number(f.total)||0)-total)<0.02)achou=f;});
  }
  return achou;
}
function fatFiltradas(){

function chart(pts,unit,demo){
  if(!pts||pts.length<2)return '<div class="empty">Ainda só existe 1 registo de preço.<br>Registe novas compras para ver a evolução.</div>';
  var w=320,h=132,pl=34,pr=12,pt2=14,pb=22;
  var ps=pts.map(function(p){return p.p;});
  var mn=Math.min.apply(null,ps),mx=Math.max.apply(null,ps),sp=(mx-mn)||(mx||1);
  function X(i){return pl+(w-pl-pr)*(i/(pts.length-1));}
  function Y(v){return h-pb-(h-pt2-pb)*((v-mn)/sp);}
  var d="";
  pts.forEach(function(p,i){d+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.p).toFixed(1)+" ";});
  var ar="M"+X(0).toFixed(1)+" "+(h-pb)+" "+d.trim().replace(/^M/,"L")+" L"+X(pts.length-1).toFixed(1)+" "+(h-pb)+" Z";
  var dots="";
  pts.forEach(function(p,i){dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.p).toFixed(1)+'" r="'+(i===pts.length-1?4.5:3)+'" fill="'+(i===pts.length-1?"#0f766e":"#fff")+'" stroke="#0f766e" stroke-width="2"/>';});
  var grid=[0,0.5,1].map(function(k){var v=mn+sp*k;
    return '<line x1="'+pl+'" y1="'+Y(v).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(v).toFixed(1)+'" stroke="#eef0f3"/><text x="'+(pl-6)+'" y="'+(Y(v)+3.5).toFixed(1)+'" font-size="9" fill="#9ca3af" text-anchor="end">'+String(Math.round(v*100)/100).replace(".",",")+'</text>';}).join("");
  var first=pts[0],lastp=pts[pts.length-1];
  var varp=first.p>0?((lastp.p-first.p)/first.p*100):0;
  var cor=varp>0?"#b91c1c":(varp<0?"#15803d":"#6b7280");
  return '<div class="row between small" style="margin-bottom:4px"><span class="mut">Evolução ('+pts.length+' registos'+(demo?' · <b>exemplo</b>':'')+')</span><span class="b" style="color:'+cor+'">'+(varp>0?"+":"")+pct(varp)+'</span></div>'+
   '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">'+grid+
   '<path d="'+ar+'" fill="rgba(15,118,110,.10)"/>'+
   '<path d="'+d.trim()+'" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
   dots+'<text x="'+pl+'" y="'+(h-6)+'" font-size="9" fill="#9ca3af">'+dmy(first.d)+'</text>'+
   '<text x="'+(w-pr)+'" y="'+(h-6)+'" font-size="9" fill="#9ca3af" text-anchor="end">'+dmy(lastp.d)+'</text></svg>';
}

     rec.map(function(c){
       var isBest=Math.abs(c.p-best)<0.0001;
       return '<tr class="'+(isBest?"best":"")+'"><td>'+(SUP[c.s]||c.s)+(isBest?'<span class="tiny">✔ mais barato</span>':'')+'</td><td class="v">'+eur(c.p)+' /'+u+'</td><td class="v tiny mut">'+dmy(c.d)+'</td></tr>';
     }).join("")+'</table></div>';

  out+='<div class="card">'+chart(h,i.u,!!DEMOIDS[i.id])+'</div>'+
   '<div class="card"><div class="b mb8">Registar novo preço</div>'+

   '<div class="tiny mut mb8">Fica guardado como '+eur(i.pk>0?i.pr/i.pk:0)+' por '+u+'.</div>'+

/* ===================== VIEW: LISTA ===================== */
function viewLista(){
  var grupos={},semPreco=[],total=0;
  st.lista.forEach(function(it){
    var i=BYNAME[it.n];
    if(!i)return;
    var r=precoRecente(i,30);
    if(!r.best){semPreco.push(it.n);return;}
    var v=r.best.p*it.q;
    total+=v;
    var k=r.best.s||"?";
    if(!grupos[k])grupos[k]={itens:[],total:0};
    grupos[k].itens.push({n:it.n,q:it.q,u:uP(i.u),p:r.best.p});
    grupos[k].total+=v;
  });
  var ordem=Object.keys(grupos).sort(function(a,b){return grupos[b].total-grupos[a].total;});
  var h='<div class="note b">🛒 <b>Lista inteligente:</b> usa os preços pagos nos <b>últimos 30 dias</b> (já convertidos para a unidade base) e escolhe o fornecedor mais barato.</div>';
  if(ordem.length){
    h+='<div class="card"><div class="row between mb8"><div class="b">🧾 Onde comprar</div><span class="pill">'+eur(total)+'</span></div>';
    ordem.forEach(function(k){
      h+='<div class="loja"><div class="lh"><span>🏪 '+(SUP[k]||k)+'</span><span>'+eur(grupos[k].total)+'</span></div>'+
       '<div class="li">'+grupos[k].itens.map(function(x){return esc(x.n)+" — "+qtd(x.q)+" "+x.u;}).join("<br>")+'</div></div>';
    });
    h+='<div class="tot big"><label>Total estimado</label><span>'+eur(total)+'</span></div></div>';
  }
  h+='<div class="card"><div class="row between mb8"><div class="b">➕ Adicionar artigo</div>'+
   (st.lista.length?'<button class="btn danger sm" data-act="lclear">Limpar</button>':'')+'</div>'+
   '<input type="text" id="lq" placeholder="🔎 procurar artigo…" value="'+esc(st.lq||"")+'" class="mb8">';
  if(st.lq){
    var p2=ativos().filter(function(i){return i.n.toLowerCase().indexOf(st.lq.toLowerCase())>=0;}).slice(0,8);
    h+='<div class="pick">'+(p2.length?p2.map(function(i){
      var r=precoRecente(i,30);
      return '<button data-act="ladd" data-n="'+esc(i.n)+'">'+esc(i.n)+(r.best?' <span class="mut small">· '+(SUP[r.best.s]||"")+' '+eur(r.best.p)+'/'+uP(i.u)+'</span>':' <span class="small" style="color:#b45309">· sem preço</span>')+'</button>';
    }).join(""):'<div class="empty">Nada encontrado</div>')+'</div>';
  }
  h+='<div class="mt8"><button class="btn ghost sm" data-act="lfromfichas" style="width:100%">📋 Adicionar ingredientes das fichas</button></div></div>';
  if(st.lista.length){
    h+='<div class="card"><div class="b mb8">Artigos na lista ('+st.lista.length+')</div>';
    st.lista.forEach(function(it,idx){
      var i=BYNAME[it.n];
      if(!i)return;
      var r=precoRecente(i,30);
      var b=r.best;
      h+='<div class="line" style="align-items:flex-start"><div class="nm" style="white-space:normal;overflow:visible">'+esc(it.n)+
       '<div class="tiny">'+(b?('🏪 <b>'+(SUP[b.s]||b.s)+'</b> · '+eur(b.p)+'/'+uP(i.u)+(r.rec?' <span style="color:#0f766e">· 30 dias</span>':' <span style="color:#b45309">· lista base</span>')):'<span style="color:#b45309">sem preço</span>')+'</div></div>'+
       '<input type="number" step="0.001" value="'+it.q+'" data-act="lqty" data-v="'+idx+'">'+
       '<div class="ct">'+(b?eur(b.p*it.q):"—")+'</div>'+
       '<button class="rm" data-act="lrm" data-v="'+idx+'">✕</button></div>';
    });
    h+='<div class="mt10"><button class="btn" data-act="lcopy">📤 Copiar lista em texto</button></div></div>';
  }else{
    h+='<div class="card tight"><div class="empty">A lista está vazia.</div></div>';
  }
  return h;
}

/* ===================== APAGAR ===================== */
function comprasDaFatura(f){
  if(!f)return [];
  var out=[];
  COMPRAS.forEach(function(c){
    if(c.fat&&c.fat===f.id){out.push(c);return;}
    if(c.d===f.data&&(supKey(c.s||"")||c.s||"")===(supKey(f.forn||"")||f.forn||""))out.push(c);
  });
  return out;
}
async function apagarPrecoNuvem(artigo,data,preco,fonte){
  if(!dbOn())return;
  return db("precos?select=id,artigo,data,preco,fonte&artigo=eq."+encodeURIComponent(artigo)+"&data=eq."+encodeURIComponent(data))
  .then(function(rows){
    var alvos=(rows||[]).filter(function(r){
      if(Math.abs((Number(r.preco)||0)-(Number(preco)||0))>0.0001)return false;
      if(fonte)return (r.fonte||"")===fonte;
      return String(r.fonte||"").indexOf("CATALOGO:")!==0&&String(r.fonte||"").indexOf("ALIAS:")!==0&&String(r.fonte||"").indexOf("MERGED:")!==0;
    });
    return alvos.reduce(function(p,r){return p.then(function(){return dbDel("precos?id=eq."+r.id);});},Promise.resolve());
  }).catch(function(){});
}
async function apagarCompraNuvem(c){
  if(!dbOn())return;
  return db("compras?select=id,artigo,data,qtd,total,preco_unit&artigo=eq."+encodeURIComponent(c.n)+"&data=eq."+encodeURIComponent(c.d))
  .then(function(rows){
    var alvos=(rows||[]).filter(function(r){
      if(Math.abs((Number(r.qtd)||0)-(Number(c.q)||0))>0.001)return false;
      if(Math.abs((Number(r.total)||0)-(Number(c.t)||0))>0.02)return false;
      return true;
    });
    return alvos.reduce(function(p,r){return p.then(function(){return dbDel("compras?id=eq."+r.id);});},Promise.resolve());
  }).catch(function(){});
}
async function apagarFaturaNuvem(f,compras){
  if(!dbOn())return;
  var q="data=eq."+encodeURIComponent(f.data)+"&fornecedor=eq."+encodeURIComponent(SUP[f.forn]||f.forn||"");
  if(f.num)q+="&numero=eq."+encodeURIComponent(f.num);
  if(Number(f.total)>0)q+="&total=eq."+Number(f.total);
  try{
    var rows=await db("faturas?select=id,data,fornecedor,numero,total&"+q);
    for(var i=0;i<(rows||[]).length;i++)await dbDel("faturas?id=eq."+rows[i].id);
  }catch(e){}
  for(var j=0;j<compras.length;j++){
    await apagarCompraNuvem(compras[j]);
    await apagarPrecoNuvem(compras[j].n,compras[j].d,compras[j].p,"Fatura (IA)");
  }
}
function apagarCompra(idx){
  var c=COMPRAS[idx];
  if(!c)return;
  COMPRAS.splice(idx,1);
  var ing=BYNAME[c.n];
  if(ing&&HIST[ing.id]){
    var hh=HIST[ing.id];
    for(var k=hh.length-1;k>=0;k--){
      if(hh[k].d===c.d&&Math.abs(hh[k].p-(Number(c.p)||0))<0.0001&&(hh[k].s||"")===(c.s||"")&&String(hh[k].f||"").indexOf("Lista de compras")!==0){
        hh.splice(k,1);break;
      }
    }
    if(!hh.length)delete HIST[ing.id];
  }
  st.pend=null;
  st.bkmsg="✔ Compra apagada: "+c.n;
  save();render();
  apagarCompraNuvem(c);
  apagarPrecoNuvem(c.n,c.d,c.p,"Fatura");
}
function apagarPreco(id,idx){
  var h=HIST[id];
  if(!h||idx<0||idx>=h.length)return;
  var ing=ING[id];
  var r=h.splice(idx,1)[0];
  if(!h.length)delete HIST[id];
  st.pend=null;
  st.bkmsg="✔ Registo de preço apagado.";
  save();render();
  if(ing)apagarPrecoNuvem(ing.n,r.d,r.p,r.f);
}
function apagarFatura(id){
  var f=null;
  FATURAS.forEach(function(x){if(x.id===id)f=x;});
  if(!f)return;
  var lig=comprasDaFatura(f);
  lig.forEach(function(c){
    var ing=BYNAME[c.n];
    if(ing&&HIST[ing.id]){
      var hh=HIST[ing.id];
      for(var k=hh.length-1;k>=0;k--){
        if(hh[k].d===c.d&&Math.abs(hh[k].p-(Number(c.p)||0))<0.0001&&(hh[k].s||"")===(c.s||"")&&String(hh[k].f||"").indexOf("Fatura (IA)")===0){
          hh.splice(k,1);break;
        }
      }
      if(!hh.length)delete HIST[ing.id];
    }
  });
  COMPRAS=COMPRAS.filter(function(c){return lig.indexOf(c)<0;});
  FATURAS=FATURAS.filter(function(x){return x.id!==id;});
  delete FOTOS_URL[id];
  store.set("mammamia_fotourl",JSON.stringify(FOTOS_URL));
  st.pend=null;st.openFat=null;st.fotoAtual=null;
  st.bkmsg="✔ Fatura apagada ("+lig.length+" compra(s) removidas e preços revertidos).";
  save();render();
  apagarFaturaNuvem(f,lig);
  (async function(){
    await fotoLocalDel(id);
    if(f.fotoUrl&&dbOn()){
      try{
        var hh={apikey:CFG.key};
        if(CFG.key.indexOf("eyJ")===0)hh.Authorization="Bearer "+CFG.key;
        await fetch(CFG.url.replace(/\/+$/,"")+"/storage/v1/object/faturas/"+id+".jpg",{method:"DELETE",headers:hh});
      }catch(e){}
    }
  })();
}
function recalcLinha(i){
  var l=st.ia.lin&&st.ia.lin[i];
  if(!l)return;
  var q=Number(l.qtd)||0;
  var cont=Number(l.cont)||1;
  var pp=Number(l.pp)||0;
  var tot=(Number(l.tot)>0)?Number(l.tot):(q*pp);
  l.tot=tot;
  l.pu=precoPorBase(tot,q,cont);
}

        un:normalizarUnidade(nl.ub||inferUnidade(nl.desc,nl.un)),
        cont:(Number(nl.cont)>0?Number(nl.cont):1),
        preco:(Number(nl.pp)>0?Number(nl.pp):(Number(nl.pu)>0?Number(nl.pu):0))};
      st.ia.pick=null;st.ia.err="";render();break;
    }
    case "ianewcancel": st.ia.newArt=null;render();break;
    case "ianewsave": {
      var na2=st.ia.newArt;
      var ln2=st.ia.lin&&st.ia.lin[na2&&na2.i];
      if(!ln2){st.ia.newArt=null;render();break;}
      var nEl=document.getElementById("naNome");
      var cEl=document.getElementById("naCat");
      var uEl=document.getElementById("naUn");
      var ctEl=document.getElementById("naCont");
      var prEl=document.getElementById("naPreco");
      var nn=nEl?String(nEl.value||"").trim():"";
      var cc=cEl?cEl.value:"merc";
      var uu=uEl?normalizarUnidade(uEl.value):"un";
      var ct=ctEl?parseFloat(ctEl.value):1;
      if(isNaN(ct)||!(ct>0))ct=1;
      var pp=prEl?parseFloat(prEl.value):0;
      if(isNaN(pp))pp=0;
      if(!nn){st.ia.err="Escreve o nome do novo artigo.";render();break;}
      if(!CATS[cc])cc="merc";
      var art=addCat({uid:newUid(),nome:nn,categoria:cc,unidade:uu,pack:ct,preco:pp,fornecedor:st.ia.forn||"rc"});
      if(!art){st.ia.err="Não foi possível criar o artigo.";render();break;}
      ln2.art=art.n;ln2.ok=true;ln2.s=1;ln2.un=uu;ln2.cont=ct;ln2.pp=pp;
      ln2.tot=(Number(ln2.qtd)||0)*pp;
      ln2.pu=precoPorBase(ln2.tot,ln2.qtd,ct);
      ln2.ant=lastPrice(art.id);
      ln2.alt=(ln2.ant>0&&ln2.pu>0)?Math.abs(ln2.pu-ln2.ant)/ln2.ant:0;
      ln2.alias=!!aliasRemember(ln2.desc,art.n);
      st.ia.newArt=null;st.ia.err="";
      st.ia.msg="✔ Artigo «"+art.n+"» criado · "+eur(art.base)+"/"+uu+" · 🔖 correspondência guardada.";
      save();render();dbUpArtigo(art);break;
    }
    case "iaapplyemb": {
      var el=st.ia.lin&&st.ia.lin[I(v)];
      if(!el||!el.art)break;
      var ta3=BYNAME[el.art];
      if(!ta3)break;
      ta3.u=el.ub||ta3.u;
      ta3.pk=(Number(el.cont)>0?Number(el.cont):(ta3.pk||1));
      ta3.pr=(Number(el.pp)>0?Number(el.pp):ta3.pr);
      ta3.base=ta3.pr>0?ta3.pr/ta3.pk:0;
      save();
      if(ta3.custom)dbUpArtigo(ta3);
      st.bkmsg="🧾 Embalagem atualizada: 1 un = "+qtd(ta3.pk)+" "+uP(ta3.u)+" → "+eur(ta3.base)+"/"+uP(ta3.u);
      render();break;
    }
    case "delcompra": st.pend={kind:"compra",idx:I(v)};render();break;
    case "delpreco": st.pend={kind:"preco",id:I(v),idx:I(t.getAttribute("data-i"))};render();break;
    case "delalias": aliasForget(v);st.bkmsg="🔖 Correspondência esquecida.";render();break;
    case "delcancel": st.pend=null;render();break;
    case "delconfirm": {
      var pnd=st.pend;
      if(!pnd){render();break;}
      if(pnd.kind==="compra")apagarCompra(pnd.idx);
      else if(pnd.kind==="preco")apagarPreco(pnd.id,pnd.idx);
      else if(pnd.kind==="fat")apagarFatura(pnd.id);
      else{st.pend=null;render();}
      break;
    }
    case "fatdel": st.pend={kind:"fat",id:v};render();break;
    case "iasave": {
      var s3=document.getElementById("iaS");
      if(s3){
        if(s3.value==="__novo"&&st.ia.novo){
          var nk=fornAdd(st.ia.novo);
          if(nk)st.ia.forn=nk;
          st.ia.novo="";
        }else{
          st.ia.forn=s3.value;
        }
      }
      var d3=document.getElementById("iaD");
      var b3=document.getElementById("iaBase");
      var i3=document.getElementById("iaIva");
      var t3=document.getElementById("iaTot");
      var n3=document.getElementById("iaNum");
      if(d3&&d3.value)st.ia.data=d3.value;
      if(b3)st.ia.base=parseFloat(b3.value)||0;
      if(i3)st.ia.iva=parseFloat(i3.value)||0;
      if(t3)st.ia.tot=parseFloat(t3.value)||0;
      if(n3)st.ia.num=n3.value;
      gravarFatura();break;
    }
    case "ladd": {
      var n1=t.getAttribute("data-n");
      var ex=null;
      st.lista.forEach(function(x){if(x.n===n1)ex=x;});
      if(ex)ex.q=(Number(ex.q)||0)+1;
      else st.lista.push({n:n1,q:1});
      st.lq="";render();save();break;
    }
    case "addlista": {
      var n2x=t.getAttribute("data-n");
      var ex2=null;
      st.lista.forEach(function(x){if(x.n===n2x)ex2=x;});
      if(ex2)ex2.q=(Number(ex2.q)||0)+1;
      else st.lista.push({n:n2x,q:1});
      st.bkmsg="✔ "+n2x+" adicionado à lista.";
      st.openIng=null;st.tab="lista";render();save();break;
    }
    case "lrm": st.lista.splice(I(v),1);render();save();break;
    case "lclear": st.lista=[];render();save();break;
    case "lfromfichas": {
      var nadd=0;
      FICHAS.forEach(function(fx){
        fx.lin.forEach(function(ln){
          var existe=false;
          st.lista.forEach(function(x){if(x.n===ln[0])existe=true;});
          if(!existe){st.lista.push({n:ln[0],q:1});nadd++;}
        });
      });
      st.bkmsg=nadd?("✔ "+nadd+" ingredientes adicionados."):"Já estavam todos.";
      render();save();break;
    }
    case "lcopy": {
      var g={},sem=[];
      st.lista.forEach(function(it){
        var i4=BYNAME[it.n];
        if(!i4)return;
        var r4=precoRecente(i4,30);
        if(!r4.best){sem.push(it.n);return;}
        var k4=r4.best.s||"?";
        if(!g[k4])g[k4]=[];
        g[k4].push("• "+it.n+" — "+qtd(it.q)+" "+uP(i4.u)+" ("+eur(r4.best.p)+"/"+uP(i4.u)+")");
      });
      var tx="🛒 Lista de compras — Mammamia\n";
      Object.keys(g).forEach(function(k5){tx+="\n🏪 "+(SUP[k5]||k5)+"\n"+g[k5].join("\n")+"\n";});
      if(sem.length)tx+="\nSem preço:\n"+sem.map(function(x){return "• "+x;}).join("\n")+"\n";
      copiarTxt(tx);st.bkmsg="📤 Lista copiada.";render();break;
    }
    case "fatopen":
      st.openFat=v;st.fotoAtual=null;render();
      (async function(){
        var f4=null;
        FATURAS.forEach(function(x){if(x.id===v)f4=x;});
        var img=await fotoGet(v);
        st.fotoAtual=img||(f4?f4.fotoUrl:"")||null;
        render();
      })();
      break;
    case "fatclose": st.openFat=null;st.fotoAtual=null;render();break;
    case "fatmes": st.fde=inicioMes();st.fate=hoje();render();break;
    case "fatano": st.fde=inicioAno();st.fate=hoje();render();break;
    case "fattodos": st.fde="";st.fate="";render();break;
    case "xlfat": copiarTxt(tabelaFaturas().map(function(r){return r.join("\t");}).join("\n"));st.bkmsg="📋 Faturas copiadas.";render();break;
    case "xlcomp": copiarTxt(tabelaCompras().map(function(r){return r.join("\t");}).join("\n"));st.bkmsg="📋 Artigos copiados.";render();break;
    case "csvfat": st.bkmsg=baixarCSV(tabelaFaturas(),"faturas_mammamia.csv")?"⬇️ Ficheiro gerado.":"⬇️ Bloqueado — usa 📋 Copiar.";render();break;
    case "csvcomp": st.bkmsg=baixarCSV(tabelaCompras(),"compras_mammamia.csv")?"⬇️ Ficheiro gerado.":"⬇️ Bloqueado — usa 📋 Copiar.";render();break;
    case "novafat": st.novaFat=true;render();break;
    case "cancfat": st.novaFat=false;render();break;
    case "savefat": {
      var dd=document.getElementById("nfD").value||hoje();
      var fo=document.getElementById("nfS").value;
      var num=document.getElementById("nfN").value||"";
      var base=parseFloat(document.getElementById("nfB").value);
      var iva=parseFloat(document.getElementById("nfI").value);
      var tot=parseFloat(document.getElementById("nfT").value);
      if(isNaN(base))base=0;
      if(isNaN(iva))iva=0;
      if(isNaN(tot))tot=0;
      if(!tot&&base)tot=base+iva;
      if(!base&&tot)base=Math.max(0,tot-iva);
      if(!iva&&tot&&base)iva=Math.max(0,tot-base);
      if(!(tot>0)){st.bkmsg="⚠️ Falta o total.";render();break;}
      var fat2={id:newFatId(),data:dd,forn:fo,num:num,base:base,iva:iva,total:tot,n:0,temFoto:false,fotoUrl:"",fonte:"manual",sync:false};
      FATURAS.push(fat2);
      st.novaFat=false;
      st.bkmsg="✔ Fatura de "+eur(tot)+" guardada. A enviar…";render();
      (async function(){
        var ok=await dbUpFatura(fat2);
        if(ok)fat2.sync=true;
        st.bkmsg=ok?"✔ Fatura guardada e sincronizada.":"⚠️ Guardada só no telemóvel.";
        save();render();
      })();
      break;
    }
    case "enviarfotos": {
      var pend=FATURAS.filter(function(f){return f.temFoto&&!f.fotoUrl&&!FOTOS_URL[f.id];});
      if(!pend.length){st.bkmsg="Não há fotos pendentes.";render();break;}
      st.bkmsg="A enviar "+pend.length+" foto(s)…";render();
      (async function(){
        var n=0;
        for(var k=0;k<pend.length;k++){
          var f6=pend[k];
          var loc=await fotoLocalGet(f6.id);
          if(!loc)continue;
          var url=await fotoUploadNuvem(f6.id,loc);
          if(url){
            guardarUrlFoto(f6.id,url);
            f6.fotoUrl=url;
            await fotoLocalDel(f6.id);
            await dbUpFatura(f6);
            n++;
          }
        }
        st.bkmsg="📤 "+n+" foto(s) enviadas e apagadas do telefone.";
        save();render();
      })();
      break;
    }
    case "reenviarfat": {
      var falta=FATURAS.filter(function(f){return !f.sync;});
      if(!falta.length){st.bkmsg="Está tudo sincronizado.";render();break;}
      st.bkmsg="A reenviar "+falta.length+" fatura(s)…";render();
      (async function(){
        var n=0;
        for(var k=0;k<falta.length;k++){
          var ok=await dbUpFatura(falta[k]);
          if(ok){falta[k].sync=true;n++;}
        }
        st.bkmsg="🔄 "+n+" de "+falta.length+" faturas sincronizadas.";
        save();render();
      })();
      break;
    }
  }
});

/* ===================== INPUTS ===================== */
document.addEventListener("input",function(e){
  var id=e.target.id;
  var da=e.target.getAttribute("data-act");
  if(id==="q"||id==="pickQ"||id==="cQ"||id==="iapickq"||id==="lq"||id==="mq"){
    var pos=e.target.selectionStart;
    if(id==="q")st.q=e.target.value;
    else if(id==="pickQ")st.pickQ=e.target.value;
    else if(id==="cQ")st.form.q=e.target.value;
    else if(id==="iapickq")st.ia.pq=e.target.value;
    else if(id==="lq")st.lq=e.target.value;
    else if(id==="mq")st.merge.q=e.target.value;
    render();
    var el=document.getElementById(id);
    if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(x){}}
    return;
  }
  if(da==="qty"){
    var fid=parseInt(e.target.getAttribute("data-v"),10);
    var idx=parseInt(e.target.getAttribute("data-i"),10);
    var ff=null;
    FICHAS.forEach(function(x){if(x.id===fid)ff=x;});
    if(ff)ff.lin[idx][1]=parseFloat(e.target.value)||0;
  }else if(da==="iaqtd"){
    var lq=st.ia.lin&&st.ia.lin[parseInt(e.target.getAttribute("data-v"),10)];
    if(lq)lq.qtd=parseFloat(e.target.value)||0;
  }else if(da==="lqty"){
    st.lista[parseInt(e.target.getAttribute("data-v"),10)].q=parseFloat(e.target.value)||0;
    saveSoon();
  }
});
document.addEventListener("change",function(e){
  var id=e.target.id;
  var da=e.target.getAttribute("data-act");
  var I=function(x){return parseInt(x,10);};
  if(id==="fde"){st.fde=e.target.value;render();return;}
  if(id==="fate"){st.fate=e.target.value;render();return;}
  if(id==="fforn"){st.fforn=e.target.value;render();return;}
  if(id==="mdl"){st.modelo=e.target.value||"";save();render();return;}
  if(da==="iapp"||da==="iacont"||da==="iaun"||da==="iatot"){
    var idx=I(e.target.getAttribute("data-v"));
    var l=st.ia.lin&&st.ia.lin[idx];
    if(l){
      if(da==="iapp")l.pp=parseFloat(e.target.value)||0;
      if(da==="iacont")l.cont=parseFloat(e.target.value)||1;
      if(da==="iaun")l.ub=normalizarUnidade(e.target.value);
      if(da==="iatot")l.tot=parseFloat(e.target.value)||0;
      recalcLinha(idx);render();
    }
    return;
  }
  if(id==="embU"||id==="embPk"||id==="embPr"){
    var eu=document.getElementById("embU");
    var epk=document.getElementById("embPk");
    var epr=document.getElementById("embPr");
    var res=document.getElementById("embRes");
    if(res&&eu&&epk&&epr){
      var pk=parseFloat(epk.value)||0;
      var pr=parseFloat(epr.value)||0;
      res.textContent="1 unidade = "+qtd(pk)+" "+normalizarUnidade(eu.value)+" → "+(pk>0?eur(pr/pk):"—")+" / "+normalizarUnidade(eu.value);
    }
    return;
  }
  if(id==="naUn"||id==="naCont"||id==="naPreco"){
    var nu=document.getElementById("naUn");
    var nc=document.getElementById("naCont");
    var np=document.getElementById("naPreco");
    var nres=document.getElementById("naRes");
    if(nres&&nu&&nc&&np){
      var c2=parseFloat(nc.value)||0;
      var p2=parseFloat(np.value)||0;
      nres.textContent="1 un = "+qtd(c2)+" "+normalizarUnidade(nu.value)+" → "+(c2>0?eur(p2/c2):"—")+" / "+normalizarUnidade(nu.value);
    }
    return;
  }
  if((id==="invFile"||id==="camFile")&&e.target.files&&e.target.files.length){
    adicionarPaginas(e.target.files);
    try{e.target.value="";}catch(x){}
  }
});

/* ===================== PÁGINAS ===================== */
function adicionarPaginas(fileList){
  if(!st.paginas)st.paginas=[];
  var ficheiros=Array.prototype.slice.call(fileList);
  var espaco=8-st.paginas.length;
  if(espaco<=0){st.ia.err="Máximo de 8 páginas por fatura.";render();return;}
  ficheiros=ficheiros.slice(0,espaco);
  st.ia.lin=null;st.ia.err="";st.ia.msg="";
  var pend=ficheiros.length;
  function fim(){
    pend--;
    if(pend>0)return;
    if(!st.paginas.length)st.ia.err="Não consegui ler os ficheiros escolhidos.";
    render();
  }
  ficheiros.forEach(function(file){
    var isPdf=(file.type==="application/pdf"||/\.pdf$/i.test(file.name||""));
    if(isPdf){
      st.paginas.push({url:null,mime:"application/pdf",nome:file.name||"PDF",pdf:true,file:file});
      fim();
      return;
    }
    var r=new FileReader();
    r.onload=function(){
      var dataUrl=r.result;
      comprimirFoto(dataUrl,function(url){
        if(url)st.paginas.push({url:url,b64:url.split(",")[1]||"",mime:"image/jpeg",nome:"Página",pdf:false});
        fim();
      });
    };
    r.readAsDataURL(file);
  });
}

/* ===================== ARRANQUE ===================== */
function carregarStor(){
  if(st.stor)return;
  (async function(){
    var e=null;
    try{if(navigator.storage&&navigator.storage.estimate)e=await navigator.storage.estimate();}catch(x){}
    st.stor={uso:(e&&e.usage)||0,quota:(e&&e.quota)||0};
    render();
  })();
}

}catch(e){}
try{

}catch(err){

if(dbOn())dbPull(true);
